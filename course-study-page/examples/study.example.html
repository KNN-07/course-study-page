<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discrete Mathematics study page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F6F6F3;--surface:#FFFFFF;--sunken:#FAFAF8;--ink:#17171A;--ink2:#33333A;--muted:#5C5C66;
  --line:#E3E3DE;--line2:#C9C9C2;--track:#EEEEEA;
  --accent:var(--course-accent,#3651D4);--accent-ink:#FFFFFF;--accent-tint:#EEF1FD;--accent-tint-ink:#1F2E80;
  --ok-bg:#E8F5EE;--ok:#155C3A;--ok-line:#1E7B4F;--bad-bg:#FCECEA;--bad:#8E1D17;--bad-line:#B3261E;
  --warn-bg:#FDF1E8;--warn:#8A3B0B;--warn-line:#E8C3A8;--inv-bg:#17171A;--inv-ink:#FFFFFF;--inv-muted:#CFCFD6;--inv-line:#4A4A52;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--display:'Space Grotesk','Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121214;--surface:#1C1C20;--sunken:#18181B;--ink:#F1F1EE;--ink2:#D2D2D6;--muted:#A3A3AD;
    --line:#2E2E34;--line2:#4A4A52;--track:#2A2A30;
    --accent:#93A5FF;--accent-ink:#0E1433;--accent-tint:#232A52;--accent-tint-ink:#C9D2FA;
    --ok-bg:#15301F;--ok:#8FD9AE;--ok-line:#3FA772;--bad-bg:#3A1A18;--bad:#F3A6A0;--bad-line:#D0554C;
    --warn-bg:#3A2613;--warn:#F0B98A;--warn-line:#7A4A22;--inv-bg:#26262B;--inv-ink:#FFFFFF;--inv-muted:#CFCFD6;--inv-line:#5A5A64;
  }
}
:root[data-theme="dark"]{
  --bg:#121214;--surface:#1C1C20;--sunken:#18181B;--ink:#F1F1EE;--ink2:#D2D2D6;--muted:#A3A3AD;
  --line:#2E2E34;--line2:#4A4A52;--track:#2A2A30;
  --accent:#93A5FF;--accent-ink:#0E1433;--accent-tint:#232A52;--accent-tint-ink:#C9D2FA;
  --ok-bg:#15301F;--ok:#8FD9AE;--ok-line:#3FA772;--bad-bg:#3A1A18;--bad:#F3A6A0;--bad-line:#D0554C;
  --warn-bg:#3A2613;--warn:#F0B98A;--warn-line:#7A4A22;--inv-bg:#26262B;--inv-ink:#FFFFFF;--inv-muted:#CFCFD6;--inv-line:#5A5A64;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
p{margin:0}
h1,h2,h3{font-family:var(--display);margin:0}
h1{font-size:clamp(28px,5vw,40px);line-height:1.1;font-weight:700;letter-spacing:-0.01em}
h2{font-size:clamp(22px,4vw,30px);line-height:1.15;font-weight:700}
h3{font-size:20px;font-weight:600}
code{font-family:var(--mono);font-size:.92em;background:var(--track);border-radius:5px;padding:1px 5px}
pre{margin:6px 0;padding:12px 14px;background:var(--sunken);border:1px solid var(--line);border-radius:10px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.5;text-align:left}
pre code{background:none;padding:0}
.app{display:flex;min-height:100vh;align-items:stretch}
aside{flex:0 0 292px;background:var(--surface);border-right:1px solid var(--line);padding:26px 16px 40px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.wrap{flex:1 1 auto;min-width:0;padding:30px 40px 80px}
main{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.topbar{display:none}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.brand{display:flex;flex-direction:column;gap:6px;padding:0 10px}
.ctitle{font-family:var(--display);font-size:19px;line-height:1.25;font-weight:700}
.bar{height:6px;background:var(--track);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
nav{display:flex;flex-direction:column;gap:18px}
nav .grp{display:flex;flex-direction:column;gap:2px}
nav .eyebrow{padding:0 10px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 10px;border:0;border-radius:8px;background:transparent;text-align:left;font-size:14px;line-height:1.3;font-weight:500;color:var(--ink)}
.row:hover{background:var(--track)}
.row.on{background:var(--accent-tint);color:var(--accent-tint-ink);font-weight:600}
.row .grow{flex:1 1 auto;min-width:0}
.row .cnt{font-size:12px;color:var(--muted);white-space:nowrap}
.row.on .cnt{color:inherit}
.num{flex:0 0 auto;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:12px;background:var(--track);color:var(--ink2)}
.row.open .num{background:var(--accent);color:var(--accent-ink)}
.subs{margin:0 0 8px 23px;border-left:1px solid var(--line);display:flex;flex-direction:column}
.sub{min-height:38px;padding:7px 12px;border:0;border-left:2px solid transparent;margin-left:-1px;background:transparent;text-align:left;font-size:13px;font-weight:500;color:var(--muted)}
.sub:hover{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.card.inv{background:var(--inv-bg);color:var(--inv-ink);border-color:var(--inv-bg)}
.card.inv .muted{color:var(--inv-muted)}
.card.dashed{border-style:dashed;color:var(--muted)}
.grid{display:grid;gap:12px}
.g-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-mods{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g-con{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g-two{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:24px;font-weight:600}
.modcard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);min-height:140px}
.modcard:hover{border-color:var(--line2)}
.modcard .n{font-family:var(--display);font-size:14px;font-weight:600;color:var(--accent)}
.modcard .t{font-family:var(--display);font-size:18px;font-weight:600;line-height:1.25}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:14px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.5}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.okb{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok);font-weight:600}
.btn.warnb{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);text-decoration:underline}
.card.inv .btn:not(.pri){background:#34343A;border-color:var(--inv-line);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--track);padding:4px;border-radius:12px}
.seg button{min-height:40px;padding:0 14px;border-radius:9px;border:0;background:transparent;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--accent-tint);color:var(--accent-tint-ink);white-space:nowrap}
.chip.plain{background:var(--track);color:var(--ink2)}
.q{font-size:17px;font-weight:600;line-height:1.45}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 14px;border-radius:10px;text-align:left;font-size:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .let{flex:0 0 auto;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--track);color:var(--ink2)}
.opt.sel{border-color:var(--accent);background:var(--accent-tint);color:var(--accent-tint-ink)}
.opt.sel .let{background:var(--accent);color:var(--accent-ink)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.opt.ok .let{background:var(--ok-line);color:#fff}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.opt.bad .let{background:var(--bad-line);color:#fff}
.fb{padding:12px 14px;border-radius:10px;font-size:14px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.info{background:var(--accent-tint);color:var(--accent-tint-ink)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.inp{flex:1 1 240px;min-width:0;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-family:var(--mono);font-size:15px}
textarea.inp{width:100%;min-height:130px;padding:12px 14px;font-family:var(--sans);line-height:1.5;resize:vertical;flex:none}
textarea.code{font-family:var(--mono);font-size:12px;min-height:110px}
.flash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;width:100%;min-height:280px;padding:36px 28px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.flash.back{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flash .big{font-family:var(--display);font-size:clamp(20px,3.6vw,28px);line-height:1.3;font-weight:600;max-width:820px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:12px 14px}
.steps .sn{flex:0 0 auto;width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.steps .sb{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.concept{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.concept .term{font-family:var(--display);font-weight:600;font-size:17px}
.concept .ex{margin-top:auto;font-family:var(--mono);font-size:13px;background:var(--accent-tint);color:var(--accent-tint-ink);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{padding:10px 12px;font-family:var(--mono);font-size:13px;font-weight:500;background:var(--inv-bg);color:var(--inv-ink);text-align:left;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--track);font-family:var(--mono);vertical-align:top}
td:first-child{font-family:var(--sans);font-weight:600}
tr:nth-child(even) td{background:var(--sunken)}
td.t,td.f{text-align:center;font-family:var(--mono);font-weight:500}
tr td.t{background:var(--ok-bg);color:var(--ok)}
tr td.f{background:var(--bad-bg);color:var(--bad)}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink2)}
.map{display:flex;flex-direction:column;gap:2px}
.maprow{display:grid;grid-template-columns:minmax(0,1.3fr) 110px 34px minmax(0,1fr);gap:12px;align-items:center;padding:8px 10px;border:0;border-radius:8px;background:transparent;text-align:left;font-size:14px;min-height:44px;width:100%}
.maprow:hover{background:var(--track)}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.segs i{height:10px;border-radius:2px;background:var(--track)}
.segs i.on{background:var(--accent)}
.segs i.tg{box-shadow:inset 0 0 0 1px var(--line2)}
.kv{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;border-top:1px solid var(--track);padding-top:8px}
.kv span:first-child{font-size:13px;color:var(--muted)}
.kv span:last-child{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--track)}
.check input{width:20px;height:20px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--accent)}
[id^="sec-"]{scroll-margin-top:20px}
figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
figure img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
figcaption{font-size:13px;color:var(--muted)}
.search{width:100%;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);font-size:14px}
.prose{display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.7;color:var(--ink2)}
.prose h4{margin:10px 0 0;font-family:var(--display);font-size:18px;font-weight:600;color:var(--ink)}
.prose ol.plain,.prose ul.plain{gap:8px}
ol.plain{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;color:var(--ink2)}
.hit{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:44px}
.hit:hover{border-color:var(--line2)}
@media (max-width:860px){
  .app{display:block}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px}
  .topbar b{font-family:var(--display);font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  aside{display:none;position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  body.menu-open aside{display:flex}
  body.menu-open .wrap{display:none}
  .wrap{padding:20px 16px 64px}
  .opts{grid-template-columns:1fr}
  .maprow{grid-template-columns:minmax(0,1fr) 80px 30px}
  .maprow .st{display:none}
  .card{padding:18px 16px}
}
@media print{aside,.topbar,.noprint{display:none!important}.wrap{padding:0}body{background:#fff}}
</style>

</head>

<script id="course-data" type="application/json">{"course":{"title":"Discrete Mathematics: Logic & Proofs","code":"[COURSE CODE]","overview":"Propositional logic, logical equivalence, quantifiers and the main proof techniques. Each module asks you to commit to an answer before it explains anything, then tests you until the level is earned.","objectives":["Build and read truth tables for compound propositions","Simplify expressions with the standard equivalence laws","Negate statements with nested quantifiers","Choose and write a direct, contrapositive, contradiction or induction proof"],"target_level":4,"lang":"en","exam_format":"[EXAM FORMAT]","math":false},"modules":[{"title":"Propositional logic","short":"Propositions","source":"[Lecture 1 slides]","primer":{"q":"A sign says \"If you are under 12, you ride free.\" An adult pays full fare. Has the sign been broken?","a":"No. The sign only promises something for under-12s. When the hypothesis is false the implication is true whatever else happens."},"summary":"A proposition is a statement that is either true or false. Connectives combine propositions, and a truth table lists the value of a compound proposition for every assignment of its parts. The implication p → q is false in exactly one case: p true and q false.","reading":[{"heading":"Statements that can be judged","body":"Logic starts by narrowing what counts as a statement. A **proposition** is a sentence that is either true or false, and never both. \"7 is prime\" is a proposition. \"Close the door\" and \"x + 1 = 3\" are not: the first is a command, and the second has no truth value until x is fixed.\n\nWe name propositions with letters such as p and q so that we can study how statements combine without caring what they say."},{"heading":"Building compound statements","body":"Five connectives build larger propositions from smaller ones:\n\n- ¬p (not p) is true exactly when p is false.\n- p ∧ q (and) is true only when both parts are true.\n- p ∨ q (or) is true when at least one part is true. It is inclusive: both being true still counts.\n- p → q (if p then q) is false in one case only: p true and q false.\n- p ↔ q (p if and only if q) is true when p and q have the same value.\n\nA **truth table** lists every possible assignment of T and F to the letters and the resulting value of the compound. With two letters there are four rows, with three there are eight, and in general 2ⁿ.","check":{"q":"How many rows does the truth table of (p ∧ q) → r need, and on how many of them is p ∧ q true?","a":"Eight rows, because there are three letters. p ∧ q is true on the two rows where p and q are both T (r can be T or F)."}},{"heading":"The implication, read as a promise","body":"The implication is the connective people get wrong, because everyday \"if\" suggests cause. In logic p → q is a promise: *whenever p holds, q holds too*. The promise is broken only if p happens and q does not.\n\nTake \"if you score 90, you get an A\". You score 95 and get an A: kept. You score 95 and get a B: broken. You score 60 and get a C: not broken, because nothing was promised about scoring 60. You score 60 and still get an A: also not broken.\n\n> An implication with a false hypothesis is true. This is called vacuous truth.\n\nThat is why the last two rows of the table for p → q are both T."},{"heading":"Three relatives of an implication","body":"From p → q you can form three other statements:\n\n1. The converse, q → p.\n2. The inverse, ¬p → ¬q.\n3. The contrapositive, ¬q → ¬p.\n\nOnly the contrapositive always has the same truth value as the original. Worked example: let p be \"n is a multiple of 4\" and q be \"n is even\". The original is true. The contrapositive, \"if n is not even then n is not a multiple of 4\", is true as well. The converse, \"if n is even then n is a multiple of 4\", fails at n = 6. The inverse fails at the same n. Converse and inverse are contrapositives of each other, so they stand or fall together.","check":{"q":"\"If it is a cat, it has whiskers.\" State the contrapositive, and say whether a whiskered seal contradicts the original.","a":"Contrapositive: if it has no whiskers, it is not a cat. The seal does not contradict anything. It would only contradict the converse, \"if it has whiskers, it is a cat\"."}}],"concepts":[{"term":"Proposition","def":"A declarative statement with exactly one truth value.","example":"\"7 is prime\" → T"},{"term":"Implication","def":"p → q is false only when p is true and q is false.","example":"F → anything ≡ T"},{"term":"Contrapositive","def":"¬q → ¬p. It is equivalent to p → q. The converse and inverse are not.","example":"p → q ≡ ¬q → ¬p"}],"table":{"toc":"Truth table","caption":"Truth table: the five connectives","headers":["p","q","¬p","p ∧ q","p ∨ q","p → q","p ↔ q"],"rows":[["T","T","F","T","T","T","T"],["T","F","F","F","T","F","F"],["F","T","T","F","T","T","F"],["F","F","T","F","F","T","T"]]},"pitfalls":["Treating p → q as false when p is false. It is vacuously true.","Mixing up the converse (q → p) with the contrapositive (¬q → ¬p)."],"sheet":[{"k":"Implication","v":"p → q ≡ ¬p ∨ q"},{"k":"Contrapositive","v":"¬q → ¬p"},{"k":"Converse","v":"q → p"},{"k":"Inverse","v":"¬p → ¬q"}]},{"title":"Logical equivalence","short":"Equivalence","source":"[Lecture 2 slides]","primer":{"q":"\"It is not the case that Ana is both tall and fast.\" Does that mean Ana is neither tall nor fast?","a":"No. It means she fails at least one of the two: not tall, or not fast. Negating an 'and' gives an 'or'."},"summary":"Two propositions are logically equivalent (≡) when they have the same truth value under every assignment. Equivalence laws let you rewrite and simplify without building a full truth table.","reading":[{"heading":"Same truth value, every time","body":"Two propositions are **logically equivalent**, written p ≡ q, when they have the same truth value on every row of the truth table. Equivalent statements can replace each other anywhere, the way 2(x + 1) can replace 2x + 2.\n\nTwo extreme cases get names. A **tautology** is true on every row, for example p ∨ ¬p. A **contradiction** is false on every row, for example p ∧ ¬p. Saying p ≡ q is the same as saying that p ↔ q is a tautology."},{"heading":"The laws worth knowing by heart","body":"You could prove any equivalence with a truth table, but tables double in size with each letter. The equivalence laws let you rewrite step by step instead.\n\n- De Morgan: ¬(p ∧ q) ≡ ¬p ∨ ¬q and ¬(p ∨ q) ≡ ¬p ∧ ¬q. Negation moves inside and the connective flips.\n- Implication: p → q ≡ ¬p ∨ q. This removes an arrow.\n- Double negation: ¬¬p ≡ p.\n- Distributive: p ∧ (q ∨ r) ≡ (p ∧ q) ∨ (p ∧ r), and the same with ∧ and ∨ swapped.\n- Absorption: p ∨ (p ∧ q) ≡ p.\n\nDe Morgan matches ordinary speech. \"It is not true that she is both tall and fast\" means she fails at least one of the two, which is an *or*.","check":{"q":"Without a table: when exactly is ¬(p ∨ q) true, in words?","a":"When neither holds: p is false and q is false. That is ¬p ∧ ¬q, which is what De Morgan gives."}},{"heading":"A derivation, line by line","body":"Negation does not distribute over an arrow, so ¬(p → q) cannot be simplified directly. Remove the arrow first.\n\n1. ¬(p → q) ≡ ¬(¬p ∨ q), by the implication law.\n2. ≡ ¬¬p ∧ ¬q, by De Morgan.\n3. ≡ p ∧ ¬q, by double negation.\n\nThe result makes sense: the only way an implication fails is p true and q false. In written proofs, apply one law per line and name it. Markers award the steps, not only the last line.\n\n> To show two statements are **not** equivalent, one row where they differ is enough.","check":{"q":"A classmate claims ¬(p → q) ≡ ¬p → ¬q. Find one row that refutes it.","a":"p false, q false. The left side is ¬(F → F) = ¬T = F. The right side is ¬p → ¬q = T → T = T. They differ on this row, so the claim is false. (p true, q true works too.)"}}],"concepts":[{"term":"Tautology","def":"True under every assignment of its variables.","example":"p ∨ ¬p"},{"term":"Contradiction","def":"False under every assignment of its variables.","example":"p ∧ ¬p"},{"term":"Equivalence","def":"p ≡ q exactly when p ↔ q is a tautology.","example":"¬¬p ≡ p"}],"table":{"toc":"Equivalence laws","caption":"Equivalence laws","headers":["Law","Form"],"rows":[["De Morgan","¬(p ∧ q) ≡ ¬p ∨ ¬q"],["De Morgan","¬(p ∨ q) ≡ ¬p ∧ ¬q"],["Implication","p → q ≡ ¬p ∨ q"],["Distributive","p ∧ (q ∨ r) ≡ (p ∧ q) ∨ (p ∧ r)"],["Absorption","p ∨ (p ∧ q) ≡ p"],["Double negation","¬¬p ≡ p"]]},"pitfalls":["Forgetting to flip ∧ and ∨ when pushing a negation inward.","Applying several laws in one line without naming them, which loses marks in proofs."],"sheet":[{"k":"De Morgan","v":"¬(p ∧ q) ≡ ¬p ∨ ¬q"},{"k":"De Morgan","v":"¬(p ∨ q) ≡ ¬p ∧ ¬q"},{"k":"Absorption","v":"p ∨ (p ∧ q) ≡ p"},{"k":"Distributive","v":"p ∧ (q ∨ r) ≡ (p∧q) ∨ (p∧r)"}]},{"title":"Predicates & quantifiers","short":"Quantifiers","source":"[Lecture 3 slides]","primer":{"q":"\"Everyone has a birthday\" and \"There is a day that is everyone's birthday\" use the same words. Do they say the same thing?","a":"No. The first is ∀ person ∃ day, which is true. The second is ∃ day ∀ person, which is false. The order of quantifiers changes the meaning."},"summary":"A predicate P(x) becomes a proposition once x is fixed or quantified. ∀ says \"for every x in the domain\" and ∃ says \"for at least one x\". The domain and the order of nested quantifiers both change the meaning.","reading":[{"heading":"From propositions to predicates","body":"\"x is even\" is not a proposition, because its truth depends on x. It is a **predicate**, written P(x). A predicate becomes a proposition in two ways: plug in a value, as in P(4), or say how many values make it true. Quantifiers do the second.\n\n- ∀x P(x), the universal, says P(x) holds for every x in the domain.\n- ∃x P(x), the existential, says P(x) holds for at least one x in the domain.\n\nOne example proves an ∃ statement. One counterexample disproves a ∀ statement. Proving ∀ needs an argument that covers every case."},{"heading":"The domain is part of the statement","body":"A quantifier ranges over a **domain**, and the same symbols can change truth value when the domain changes. ∃x (x² = 2) is true over the real numbers, where √2 is available, and false over the rationals. ∀x (x² ≥ x) is true over the integers and false over the reals, where x = 0.5 fails.\n\n> Always state the domain. A quantified statement with no domain has not finished saying anything.","check":{"q":"Is ∀x ∃y (x · y = 1) true over the non-zero reals? Over the integers?","a":"True over the non-zero reals: take y = 1/x. False over the integers: x = 2 has no integer y, and x = 0 has none at all."}},{"heading":"Order of quantifiers","body":"With two quantifiers, order matters. Read them left to right as a game: each ∀ is chosen by an opponent, and each ∃ is your reply, made knowing everything chosen before it.\n\nOver the integers, ∀x ∃y (y > x) is true. Whatever x the opponent picks, you answer y = x + 1. But ∃y ∀x (y > x) asks you to name one y first that beats every x, and no integer does. Same symbols, opposite truth values."},{"heading":"Negating quantified statements","body":"A negation passes through quantifiers from left to right, flipping each one, and lands on the predicate.\n\n- ¬∀x P(x) ≡ ∃x ¬P(x): \"not all\" means \"some do not\".\n- ¬∃x P(x) ≡ ∀x ¬P(x): \"none\" means \"all do not\".\n\nWorked example: negate ∀x ∃y (x + y = 0).\n\n1. ¬∀x ∃y (x + y = 0)\n2. ≡ ∃x ¬∃y (x + y = 0)\n3. ≡ ∃x ∀y (x + y ≠ 0)\n\nIn words: some x has no y that cancels it. The most common error is to push the ¬ inside but leave a quantifier unflipped.","check":{"q":"Negate \"every student has passed at least one exam\" in plain words.","a":"Some student has failed every exam (or: some student has passed no exam). ∀ student ∃ exam becomes ∃ student ∀ exam, with the predicate negated."}}],"concepts":[{"term":"Universal ∀","def":"∀x P(x) is true when P(x) holds for every x in the domain.","example":"∀x ∈ ℤ (x² ≥ 0)"},{"term":"Existential ∃","def":"∃x P(x) is true when P(x) holds for at least one x.","example":"∃x ∈ ℤ (x + 3 = 0)"},{"term":"Order matters","def":"Swapping ∀ and ∃ in a nested statement can change its truth value.","example":"∀x ∃y (y > x) ≢ ∃y ∀x (y > x)"}],"table":{"toc":"Negation rules","caption":"Negating quantifiers","headers":["Statement","Negation","In words"],"rows":[["∀x P(x)","∃x ¬P(x)","Some x fails P"],["∃x P(x)","∀x ¬P(x)","No x satisfies P"],["∀x ∃y P(x,y)","∃x ∀y ¬P(x,y)","Some x has no matching y"]]},"pitfalls":["Negating ∀ into ∀¬ instead of ∃¬.","Forgetting the domain: ∃x (x² = 2) is true over ℝ but false over ℚ."],"sheet":[{"k":"Negate ∀","v":"¬∀x P(x) ≡ ∃x ¬P(x)"},{"k":"Negate ∃","v":"¬∃x P(x) ≡ ∀x ¬P(x)"},{"k":"Nested","v":"¬∀x∃y P ≡ ∃x∀y ¬P"}]},{"title":"Proof techniques","short":"Proofs","source":"[Lecture 4 slides]","primer":{"q":"You must prove \"if n² is even then n is even\". Starting from \"n² = 2k\" gets stuck at a square root. What else could you assume instead?","a":"Assume n is odd and show n² is odd. That is the contrapositive, and it is the same claim."},"summary":"Pick the proof shape from the statement. A direct proof follows the implication forward. Contrapositive and contradiction work from a negation. Induction proves a claim for every natural number from a base case and a step.","reading":[{"heading":"Read the shape of the claim first","body":"Most claims you are asked to prove have the shape \"for all x, if P(x) then Q(x)\". The technique depends on which end gives you something to compute with. Before writing anything, write down what you may assume and what you must reach."},{"heading":"Direct proof","body":"Assume the hypothesis and work forward to the conclusion.\n\nClaim: if n is odd then n² is odd. Assume n is odd, so n = 2k + 1 for some integer k. Then n² = 4k² + 4k + 1 = 2(2k² + 2k) + 1, which is one more than an even number, so n² is odd.\n\nThe key move is replacing a word (\"odd\") with its definition (\"2k + 1\"). Most direct proofs begin that way."},{"heading":"Contrapositive and contradiction","body":"Sometimes the hypothesis is hard to use. \"If n² is even then n is even\" starts from n² = 2k, and taking a square root leads nowhere. Since p → q ≡ ¬q → ¬p, prove the **contrapositive** instead: assume n is odd and show n² is odd, which is the direct proof above.\n\nA proof by **contradiction** assumes the negation of the whole claim and derives something impossible. For an implication p → q that means assuming p ∧ ¬q. Use it when the negation hands you a concrete object to reason about, as in the classic proof that √2 is irrational.\n\n> Contrapositive assumes ¬q and reaches ¬p. Contradiction assumes p and ¬q together and reaches an absurdity.","check":{"q":"To prove \"if 3n + 2 is odd then n is odd\", which technique would you try first, and what would you assume?","a":"Contrapositive. Assume n is even, n = 2k. Then 3n + 2 = 6k + 2 = 2(3k + 1), which is even. Starting directly from 3n + 2 = 2k + 1 gives n = (2k − 1)/3, which is awkward."}},{"heading":"Induction","body":"Induction proves a claim P(n) for every natural number n ≥ some base. It has two obligations:\n\n1. Base case: prove P(base) directly.\n2. Inductive step: assume P(k) for an arbitrary k ≥ base (the inductive hypothesis) and prove P(k + 1).\n\nThe step is a machine that passes truth from each case to the next. The base case is what you feed into it. Either one alone proves nothing.\n\nWorked example: 1 + 2 + … + n = n(n + 1)/2. Base: n = 1 gives 1 = 1·2/2. Step: assume the formula for k. Then 1 + … + k + (k + 1) = k(k + 1)/2 + (k + 1) = (k + 1)(k + 2)/2, which is the formula with n = k + 1.\n\nTwo checks before you hand in an induction proof: did you prove the base case, and did the step actually use the hypothesis? If the hypothesis was never used, either the step is wrong or induction was not needed.","check":{"q":"A step proves P(k) → P(k + 1) for all k ≥ 1, but P(1) is false and P(2) happens to be true. For which n is P(n) proved?","a":"For all n ≥ 2, provided P(2) is proved separately and used as the base. The step alone proves no instance."}}],"concepts":[{"term":"Direct","def":"Assume p, chain known facts until you reach q.","example":"n odd → n² odd"},{"term":"Contrapositive","def":"Prove ¬q → ¬p instead of p → q.","example":"n² even → n even"},{"term":"Induction","def":"Prove P(base), then prove P(k) → P(k+1) for every k ≥ base.","example":"1 + … + n = n(n+1)/2"}],"table":{"toc":"Choosing a technique","caption":"Which technique, when","headers":["Technique","You assume","You show"],"rows":[["Direct","p","q"],["Contrapositive","¬q","¬p"],["Contradiction","¬(claim)","a contradiction"],["Induction","P(k)","P(k+1), plus base case"]]},"pitfalls":["Proving the converse by accident (assuming q, reaching p).","Skipping the base case in induction, or never using the hypothesis P(k) in the step."],"sheet":[{"k":"Direct","v":"assume p ⇒ show q"},{"k":"Contrapositive","v":"assume ¬q ⇒ show ¬p"},{"k":"Contradiction","v":"assume ¬P ⇒ reach ⊥"},{"k":"Induction","v":"P(1), P(k) → P(k+1)"}]}],"diagnostic":[{"m":0,"difficulty":1,"q":"p is true and q is false. What is the value of p → q?","options":["True","False","It has no value","Same as q → p"],"answer":1,"why":"This is the single row where an implication is false.","id":"d-41234d2a"},{"m":1,"difficulty":2,"q":"Which expression always has the same truth value as ¬(p ∧ q)?","options":["¬p ∧ ¬q","p ∨ q","¬p ∨ ¬q","¬p ∧ q"],"answer":2,"why":"De Morgan: the negation distributes and ∧ becomes ∨.","id":"d-8f2cd1dc"},{"m":2,"difficulty":2,"q":"Which is the negation of \"every student passed\"?","options":["No student passed","Some student did not pass","Some student passed","Every student failed"],"answer":1,"why":"¬∀x P(x) ≡ ∃x ¬P(x). One failure is enough.","id":"d-56ddd343"},{"m":3,"difficulty":3,"q":"An induction step proves P(k) → P(k+1) for all k ≥ 1, but the base case P(1) is false. What has been shown about P(n)?","options":["P(n) holds for all n ≥ 2","P(n) holds for all n ≥ 1","Nothing about any particular n","P(n) is false for all n"],"answer":2,"why":"The step only passes truth along. With no true starting case it establishes no instance, and it does not show falsity either.","id":"d-01e97595"}],"quiz":[{"m":0,"kind":"predict","difficulty":1,"q":"p is false and q is true. What is the value of p → q?","options":["False","True","Undefined","The same as q → p"],"answer":1,"why":"An implication with a false hypothesis is vacuously true. It is tempting to call it false because nothing was 'caused', but the only false row is p true, q false.","probes":{"0":"List the one row of the truth table where an implication is false. Is this that row?","2":"A truth table assigns a value on every row. Which value does the definition give when the hypothesis fails?","3":"Work out q → p for these values. Is it equal to what the definition gives for p → q here?"},"defend":{"q":"So \"if 2 + 2 = 5 then the moon is cheese\" is a true statement?","a":"Yes. The implication claims something only about cases where the hypothesis holds. There are none, so the claim is never violated."},"src":"[Lecture 1 slides]","id":"q-7f677ebd"},{"m":0,"kind":"connect","difficulty":2,"q":"Which statement always has the same truth value as p → q?","options":["¬q → ¬p","q → p","¬p → ¬q","p ∧ ¬q"],"answer":0,"why":"The contrapositive matches p → q on every row. The converse q → p and the inverse ¬p → ¬q match each other, not the original.","probes":{"1":"Take p false, q true. What is p → q? What is the statement you chose?","2":"Take p false, q true. Evaluate both sides. Do they agree?","3":"On the row p true, q false, what is p → q and what is your choice?"},"src":"[Lecture 1 slides]","id":"q-26e5d9c3"},{"m":0,"kind":"flaw","difficulty":3,"q":"A student writes: \"If it is a square then it has four sides. This shape has four sides, so it is a square.\" Which error is this?","options":["Using the inverse as if it were the original","Denying the hypothesis","Using the converse as if it were the original","A false premise"],"answer":2,"why":"The argument runs from q back to p, which is the converse. The premise itself is true, and nothing was negated, so it is not the inverse.","probes":{"0":"Does the argument negate anything? Write the student's inference in the form ? → ?.","1":"Which fact did the student start from: about being a square, or about having four sides?","3":"Is \"a square has four sides\" actually false? If not, the fault is in the step, not the premise."},"src":"[Lecture 1 slides]","id":"q-afc931a6"},{"m":1,"kind":"apply","difficulty":1,"q":"¬(p ∨ q) is equivalent to:","options":["¬p ∨ ¬q","p ∧ q","¬p ∨ q","¬p ∧ ¬q"],"answer":3,"why":"De Morgan: push the negation in and flip ∨ to ∧. Keeping the ∨ is the usual slip.","probes":{"0":"Take p true, q false. Evaluate ¬(p ∨ q), then your choice. Same value?","1":"Where did the negations go? Try p false, q false on both.","2":"Take p false, q true. Evaluate the original and your choice."},"src":"[Lecture 2 slides]","id":"q-505d81e8"},{"m":1,"kind":"predict","difficulty":2,"q":"p ∨ (p ∧ q) simplifies to:","options":["p ∧ q","p","q","p ∨ q"],"answer":1,"why":"Absorption. If p is true the whole expression is true. If p is false then p ∧ q is false too. q never matters.","probes":{"0":"Take p true, q false. What is the original expression? What is your answer?","2":"Take p true, q false. Does the original depend on q at all?","3":"Take p false, q true. Evaluate the original and your answer."},"src":"[Lecture 2 slides]","id":"q-ef8dcfe2"},{"m":1,"kind":"flaw","difficulty":3,"q":"A proof contains the line ¬(p → q) ≡ ¬p → ¬q. What is wrong with it?","options":["Nothing, it is the inverse law","Negation was distributed over → as if it were a connective that allows that","It should read ¬q → ¬p","It is missing a double negation"],"answer":1,"why":"Negation does not distribute over →. Rewrite first: ¬(p → q) ≡ ¬(¬p ∨ q) ≡ p ∧ ¬q. The contrapositive ¬q → ¬p is equivalent to p → q itself, not to its negation.","probes":{"0":"Take p false, q true. Evaluate each side of the line. Are they equal?","2":"¬q → ¬p is equivalent to which statement: p → q, or its negation?","3":"Where would a double negation come from? Rewrite p → q with ∨ first and see what appears."},"defend":{"q":"But the two sides agree when p and q are both true. Is that not enough?","a":"Equivalence needs agreement on every row. They differ at p false, q true: the left side is false and the right side is true."},"src":"[Lecture 2 slides]","id":"q-93b0bd91"},{"m":2,"kind":"predict","difficulty":2,"q":"Over the integers, which statement is true?","options":["∃y ∀x (y > x)","∀x (x² > 0)","∀x ∃y (y > x)","∃x (x² \u003c 0)"],"answer":2,"why":"For any x, y = x + 1 works. No single y beats every integer, and x = 0 breaks x² > 0.","probes":{"0":"Name the y. Is it greater than y + 1?","1":"Try every small integer, including the one between −1 and 1.","3":"Can a square of an integer be negative? Try one."},"src":"[Lecture 3 slides]","id":"q-9e2d9644"},{"m":2,"kind":"apply","difficulty":2,"q":"What is the negation of ∀x ∃y (x + y = 0)?","options":["∀x ∃y (x + y ≠ 0)","∃x ∃y (x + y ≠ 0)","∀x ∀y (x + y ≠ 0)","∃x ∀y (x + y ≠ 0)"],"answer":3,"why":"Each quantifier flips as the negation passes it, and the predicate is negated last. Leaving a quantifier unflipped is the usual error.","probes":{"0":"What does ¬∀x become on its own? Did the first quantifier change in your choice?","1":"After ¬ passes ∀x, it meets ∃y. What does ¬∃y become?","2":"The original says every x has a partner. To deny it, how many x without a partner do you need?"},"src":"[Lecture 3 slides]","id":"q-01913b34"},{"m":2,"kind":"explain","difficulty":3,"q":"∃x (x² = 2) is true over ℝ and false over ℚ. What does this show?","options":["The predicate is ambiguous","A quantified statement has no truth value until its domain is fixed","∃ behaves like ∀ on infinite domains","The statement is neither true nor false"],"answer":1,"why":"The quantifier ranges over a domain, and changing the domain changes which witnesses exist. The predicate x² = 2 itself is perfectly precise.","probes":{"0":"Is there any doubt about what x² = 2 means for a given x? What is it that changed between the two cases?","2":"Over ℚ, is the statement true for all x, for some x, or for none?","3":"Once you say 'over ℝ', can you decide it? Then is it really without a truth value?"},"src":"[Lecture 3 slides]","id":"q-a980b982"},{"m":3,"kind":"apply","difficulty":2,"q":"Best approach for \"if n² is even, then n is even\"?","options":["Contrapositive","Direct proof","Induction on n","Checking n = 2, 4, 6"],"answer":0,"why":"Prove \"if n is odd then n² is odd\": n = 2k + 1 gives n² = 2(2k² + 2k) + 1. A direct start from n² = 2k leads to a square root with nowhere to go.","probes":{"1":"Start it: n² = 2k. What is your next line, and is n an integer expression of k?","2":"What would P(k) → P(k+1) look like here? Does knowing the claim for k help with k + 1?","3":"How many cases does \"for all n\" cover, and how many did you check?"},"src":"[Lecture 4 slides]","id":"q-37d1e03a"},{"m":3,"kind":"flaw","difficulty":3,"q":"An induction proof of P(n) for n ≥ 1 shows P(1), then writes: \"Assume P(k+1). Then … so P(k) holds.\" What is wrong?","options":["The base case should be P(0)","The step runs backwards, from k + 1 down to k","Induction cannot use an assumption","Nothing, the step is valid"],"answer":1,"why":"The step must carry truth upward, P(k) → P(k+1). Going downward from an assumed P(k+1) never reaches any case above the base.","probes":{"0":"The claim is for n ≥ 1. Which is the first case that needs proving?","2":"What is the inductive hypothesis, if not an assumption?","3":"You know P(1). Using only the step as written, can you get P(2)?"},"src":"[Lecture 4 slides]","id":"q-7172ba0e"},{"m":3,"kind":"connect","difficulty":2,"q":"A proof by contradiction of p → q begins by assuming:","options":["¬p","¬q → ¬p","q","p ∧ ¬q"],"answer":3,"why":"Contradiction assumes the negation of the whole claim, and ¬(p → q) ≡ p ∧ ¬q. Assuming ¬q alone and deriving ¬p is the contrapositive method.","probes":{"0":"What is the negation of p → q? Rewrite p → q with ∨ and negate it.","1":"That is a statement equivalent to the claim. Would assuming the claim help you contradict it?","2":"If you assume q, which direction are you heading: toward the claim or its converse?"},"src":"[Lecture 4 slides]","id":"q-f646cc73"}],"fill":[{"m":0,"difficulty":1,"prompt":"The converse of p → q is ___.","accept":["q → p","q->p","q implies p","if q then p"],"hint":"Swap hypothesis and conclusion.","answer":"q → p","src":"[Lecture 1 slides]","id":"f-31491e12"},{"m":0,"difficulty":2,"prompt":"Rewrite p → q using only ¬ and ∨.","accept":["¬p ∨ q","~p v q","not p or q","!p || q","¬pvq","q ∨ ¬p"],"hint":"It is false only when p is true and q is false.","answer":"¬p ∨ q","src":"[Lecture 1 slides]","id":"f-cd74a2a6"},{"m":1,"difficulty":1,"prompt":"¬(p ∧ q) ≡ ¬p ___ ¬q. Which connective goes in the blank?","accept":["∨","v","or","\\/","||"],"hint":"De Morgan flips the connective.","answer":"∨ (or)","src":"[Lecture 2 slides]","id":"f-d869efc2"},{"m":1,"difficulty":3,"prompt":"Simplify ¬(p → q) to an expression with no → and no outer negation.","accept":["p ∧ ¬q","p ^ ~q","p and not q","p & !q","p && !q","¬q ∧ p"],"hint":"Rewrite the implication with ∨, then apply De Morgan.","answer":"p ∧ ¬q","src":"[Lecture 2 slides]","id":"f-671fbb6b"},{"m":2,"difficulty":1,"prompt":"¬∀x P(x) ≡ ___ ¬P(x). Fill in the quantifier.","accept":["∃x","∃","exists x","there exists x","ex"],"hint":"\"Not all\" means \"some do not\".","answer":"∃x","src":"[Lecture 3 slides]","id":"f-2ddc905e"},{"m":3,"difficulty":1,"prompt":"After the base case, the inductive step proves P(k) → ___.","accept":["p(k+1)","re:^p\\s*\\(\\s*k\\s*\\+\\s*1\\s*\\)$"],"hint":"The next case.","answer":"P(k+1)","src":"[Lecture 4 slides]","id":"f-dd297f6d"}],"flashcards":[{"m":0,"front":"When is p → q false?","back":"Only when p is true and q is false.","id":"c-6b86e4e6"},{"m":0,"front":"Which of converse, inverse, contrapositive is equivalent to p → q?","back":"Only the contrapositive, ¬q → ¬p.","id":"c-5c16d35d"},{"m":0,"front":"When is p ↔ q true?","back":"When p and q have the same truth value.","id":"c-90e307c8"},{"m":1,"front":"¬(p ∧ q) ≡ ?","back":"¬p ∨ ¬q (De Morgan)","id":"c-1ecc12a9"},{"m":1,"front":"Why is p ∨ (p ∧ q) just p?","back":"If p is true the ∨ is true. If p is false, p ∧ q is false as well. q never changes the result.","id":"c-41412e66"},{"m":1,"front":"How do you test whether two propositions are equivalent?","back":"Same truth value on every row, or equivalently p ↔ q is a tautology.","id":"c-7b957781"},{"m":2,"front":"Negate ∀x P(x)","back":"∃x ¬P(x)","id":"c-b61b12f2"},{"m":2,"front":"Negate ∃x P(x)","back":"∀x ¬P(x)","id":"c-473713ff"},{"m":2,"front":"Why are ∀x ∃y and ∃y ∀x different?","back":"In ∀x ∃y the y may depend on x. In ∃y ∀x one y must work for every x.","id":"c-09645403"},{"m":3,"front":"The two parts of an induction proof","back":"Base case P(1), and inductive step P(k) → P(k+1).","id":"c-aa458243"},{"m":3,"front":"What do you assume in a proof by contradiction?","back":"The negation of the whole claim. Then derive a contradiction.","id":"c-e47299cb"},{"m":3,"front":"When is the contrapositive easier than a direct proof?","back":"When ¬q gives you something concrete to compute with and p does not.","id":"c-7a5e61d1"}],"worked":[{"m":0,"difficulty":2,"title":"Is ((p → q) ∧ p) → q a tautology?","steps":[{"text":"It can only be false if (p → q) ∧ p is T and q is F.","why":"Implication","ask":"In which single case is an implication false? Apply that to the outer →."},{"text":"(p → q) ∧ p is T, so p is T and p → q is T.","why":"Conjunction","ask":"What does a true ∧ tell you about each part?"},{"text":"p T and p → q T force q to be T.","why":"Implication","ask":"With p true, what must q be for p → q to hold?"},{"text":"q cannot be both T and F, so it is never false: a tautology.","why":"Modus ponens","ask":"Compare what you now know about q with what step 1 required."}],"src":"[Lecture 1 slides]","id":"w-8569543c"},{"m":1,"difficulty":2,"title":"Show that ¬(p → q) ≡ p ∧ ¬q.","steps":[{"text":"¬(p → q) ≡ ¬(¬p ∨ q)","why":"Implication law","ask":"Negation does not distribute over →. What can you replace p → q with first?"},{"text":"≡ ¬¬p ∧ ¬q","why":"De Morgan","ask":"Which law pushes a negation through ∨?"},{"text":"≡ p ∧ ¬q","why":"Double negation","ask":"What is left to tidy up?"}],"src":"[Lecture 2 slides]","id":"w-38823718"},{"m":2,"difficulty":2,"title":"Negate ∀x ∃y (x + y = 0) and say it in words.","steps":[{"text":"¬∀x ∃y (x + y = 0)","why":"Start","ask":"Write the negation as one symbol in front before moving anything."},{"text":"≡ ∃x ¬∃y (x + y = 0)","why":"Negate ∀","ask":"What does ¬ do to the first quantifier it meets?"},{"text":"≡ ∃x ∀y (x + y ≠ 0)","why":"Negate ∃","ask":"And to the second? What happens to the predicate last?"},{"text":"Some x has no y that sums with it to 0.","why":"In words","ask":"Read it aloud without symbols."}],"src":"[Lecture 3 slides]","id":"w-359d9206"},{"m":3,"difficulty":3,"title":"Prove 1 + 2 + … + n = n(n+1)/2 for all n ≥ 1.","steps":[{"text":"n = 1: LHS = 1, RHS = 1·2/2 = 1.","why":"Base case","ask":"Which technique fits a claim about every n ≥ 1, and what is its first obligation?"},{"text":"Assume 1 + … + k = k(k+1)/2.","why":"Hypothesis","ask":"State exactly what you are allowed to assume in the step."},{"text":"1 + … + k + (k+1) = k(k+1)/2 + (k+1)","why":"Use hypothesis","ask":"Write the left side of P(k+1). Where does the hypothesis fit inside it?"},{"text":"= (k+1)(k+2)/2, which is P(k+1).","why":"Factor","ask":"What is the target right-hand side for k + 1? Factor toward it."},{"text":"So P(n) holds for every n ≥ 1.","why":"Induction","ask":"Which two facts together give the conclusion?"}],"src":"[Lecture 4 slides]","id":"w-df30860c"}],"explain":[{"m":0,"prompt":"Explain to a classmate why an implication with a false hypothesis counts as true.","rubric":["States that p → q is false only when p is true and q is false","Says the statement makes no claim when p is false, so it cannot be violated","Gives a concrete everyday or numeric example"],"id":"x-9beb3200"},{"m":1,"prompt":"Explain why ¬(p ∧ q) is ¬p ∨ ¬q and not ¬p ∧ ¬q.","rubric":["Says p ∧ q fails as soon as one part fails","Shows a row (for example p true, q false) where the two candidates differ","Names the law as De Morgan"],"id":"x-e8ae795f"},{"m":2,"prompt":"Explain, with an example, why swapping ∀ and ∃ can change the truth of a statement.","rubric":["Says that in ∀x ∃y the y may depend on x","Says that in ∃y ∀x a single y must work for all x","Gives a statement that is true one way and false the other","Fixes a domain for the example"],"id":"x-dc740378"},{"m":3,"prompt":"Explain why an induction proof needs both the base case and the step.","rubric":["Says the step only passes truth from k to k + 1","Says the base case supplies the first true instance","Describes what goes wrong with the step alone or the base alone"],"id":"x-c73f77f7"}],"integrative":[{"title":"Negate, then prove","prompt":"Consider the claim: for every integer n, if n² is odd then n is odd. (a) Write the claim with quantifiers. (b) Write its negation in simplified form. (c) Prove the claim.","modules":[0,1,2,3],"rubric":["(a) ∀n ∈ ℤ (n² odd → n odd)","(b) ∃n ∈ ℤ (n² odd ∧ n even), with the quantifier flipped and the implication negated to p ∧ ¬q","(c) Chooses contrapositive (or contradiction) and says so","(c) Writes n = 2k and derives n² = 2(2k²), so n² is even","(c) Concludes by stating that the contrapositive is equivalent to the claim"],"solution":"(a) ∀n ∈ ℤ (n² odd → n odd). (b) ∃n ∈ ℤ (n² odd ∧ n even). (c) Contrapositive: suppose n is even, n = 2k. Then n² = 4k² = 2(2k²), which is even. So n even → n² even, which is equivalent to n² odd → n odd.","id":"i-2dbd6437"}],"id":"discrete-mathematics-logic-proofs-268d6447","built":"2026-11-16"}</script>
<script>
(function(){
'use strict';
var DATA=JSON.parse(document.getElementById('course-data').textContent);
var C=DATA.course||{}, M=DATA.modules||[];
var POOL={q:DATA.quiz||[],f:DATA.fill||[],fc:DATA.flashcards||[],w:DATA.worked||[],x:DATA.explain||[],d:DATA.diagnostic||[],i:DATA.integrative||[]};
var BY={};Object.keys(POOL).forEach(function(k){POOL[k].forEach(function(it,n){it._t=k;if(!it.id)it.id=k+'-'+n;BY[it.id]=it;});});
var CORE=['q','f','fc','w'];
var TARGET=Math.min(5,Math.max(1,C.target_level||4));
var MIN=60e3,GAP=10*MIN,DAY=864e5,IV=[GAP,GAP,DAY,3*DAY,7*DAY,16*DAY];
var LV=['unaware','heard of it','can follow along','can do with help','can do independently','can teach it'];
var KIND={predict:'Predict',explain:'Explain why',flaw:'Find the flaw',apply:'Apply',connect:'Connect',recall:'Recall'};
var TABS=[['q','Quiz'],['f','Short answer'],['fc','Flashcards'],['w','Worked problems'],['x','Teach it back']];
var LET='ABCDEFGH';
if(C.accent&&/^#[0-9a-fA-F]{6}$/.test(C.accent))document.documentElement.style.setProperty('--course-accent',C.accent);

/* ---------- state ---------- */
var KEY='course-study:'+(DATA.id||C.title||'course');
function blank(){return{v:1,items:{},place:{},diag:null,final:null,opened:{},explain:{},diff:'std',selfTest:false,exam:null,flags:{},notes:{}};}
function load(){try{var r=localStorage.getItem(KEY);if(r)return Object.assign(blank(),JSON.parse(r));}catch(e){}return blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load();
var UI={view:'overview',m:0,tab:'q',all:false,run:null,menu:false,unveil:{},primer:{},notice:[],confirmReset:false,importMsg:''};

/* ---------- text ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function T(s){var h=esc(s);
  h=h.replace(/```[\w+-]*\n?([\s\S]*?)```/g,function(_,c){return '<pre><code>'+c.replace(/\n$/,'')+'</code></pre>';});
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s](?:[^*\n]*[^*\s])?)\*(?=[\s.,;:!?)]|$)/g,'$1<em>$2</em>');
  return h.replace(/\n/g,'<br>');}
/* block text for lessons: paragraphs, - lists, 1. lists, > callouts, ### headings, fenced code */
function B(s){
  var out=[];
  String(s==null?'':s).replace(/\r/g,'').split('```').forEach(function(seg,i){
    if(i%2){out.push('<pre><code>'+esc(seg.replace(/^[\w+-]*\n/,'').replace(/\n$/,''))+'</code></pre>');return;}
    seg.split(/\n\s*\n/).forEach(function(blk){
      blk=blk.replace(/^\n+|\n+$/g,'');if(!blk)return;
      var lines=blk.split('\n'),all=function(re){return lines.every(function(l){return re.test(l);});},strip=function(re){return lines.map(function(l){return l.replace(re,'');});};
      if(all(/^\s*[-*•]\s+/))out.push('<ul class="plain">'+strip(/^\s*[-*•]\s+/).map(function(l){return '<li>'+T(l)+'</li>';}).join('')+'</ul>');
      else if(all(/^\s*\d+[.)]\s+/))out.push('<ol class="plain">'+strip(/^\s*\d+[.)]\s+/).map(function(l){return '<li>'+T(l)+'</li>';}).join('')+'</ol>');
      else if(all(/^>\s?/))out.push('<p class="fb info">'+T(strip(/^>\s?/).join('\n'))+'</p>');
      else if(lines.length===1&&/^#{1,4}\s+/.test(blk))out.push('<h4>'+T(blk.replace(/^#+\s+/,''))+'</h4>');
      else out.push('<p>'+T(blk)+'</p>');
    });
  });
  return out.join('');
}
function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
function pad(n){return String(n+1).padStart(2,'0');}
function tag(m){return M[m]?'M'+(m+1)+' · '+esc(M[m].short||M[m].title):'Whole course';}
function fig(f){if(!f||!f.src||!/^(data:image\/|https:\/\/)/.test(f.src))return '';return '<figure><img src="'+esc(f.src)+'" alt="'+esc(f.alt||'')+'" loading="lazy">'+(f.caption?'<figcaption>'+T(f.caption)+'</figcaption>':'')+'</figure>';}
function copyText(s){
  function fb(){try{var a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}catch(e){}}
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).catch(fb);else fb();}catch(e){fb();}
}
function download(name,text,mime){
  try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove();return true;}catch(e){return false;}
}
function plain(it){return String(it.q||it.prompt||it.front||it.title||'').replace(/\s+/g,' ');}
/* exam date: compresses the review schedule so every item returns before the exam */
function examTs(){var d=S.exam||C.exam_date;if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return 0;var p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2],9).getTime();}
function timeLeft(){var e=examTs();return e?e-Date.now():0;}
function iv(box){var base=IV[box],left=timeLeft();return left>0?Math.max(GAP,Math.min(base,left*[.02,.02,.1,.25,.5,.8][box])):base;}
function ago(ms){var m=Math.round(ms/MIN);if(m<60)return m+' min';var h=Math.round(m/60);if(h<48)return h+' h';return Math.round(h/24)+' days';}

/* ---------- mastery model ---------- */
function rec(id){return S.items[id]||{};}
function cnt(id){return rec(id).c||0;}
function modItems(m,types){var out=[];(types||CORE).forEach(function(k){POOL[k].forEach(function(it){if(it.m===m)out.push(it);});});return out;}
function evidence(m){
  var its=modItems(m),lvl=0;
  if(S.opened[m]||its.some(function(it){return rec(it.id).att;}))lvl=1;
  if(!its.length)return lvl;
  var c1=its.filter(function(it){return cnt(it.id)>=1;}).length/its.length;
  var c2=its.filter(function(it){return cnt(it.id)>=2;}).length/its.length;
  if(c1>=.5)lvl=2;
  if(c1>=.8)lvl=3;
  var wk=POOL.w.filter(function(it){return it.m===m;});
  if(c2>=.8&&(!wk.length||wk.some(function(it){return cnt(it.id)>=1;})))lvl=4;
  if(lvl===4){
    var hard=its.filter(function(it){return (it.difficulty||2)>=3;}),ex=POOL.x.filter(function(it){return it.m===m;});
    if((hard.length||ex.length)&&hard.every(function(it){return cnt(it.id)>=2;})&&ex.every(function(it){return cnt(it.id)>=1;}))lvl=5;
  }
  return lvl;
}
function level(m){return Math.max(evidence(m),Math.min(3,S.place[m]||0));}
function levels(){return M.map(function(_,m){return level(m);});}
function overallPct(){if(!M.length)return 0;var s=0;levels().forEach(function(l){s+=Math.min(l,TARGET);});return Math.round(100*s/(TARGET*M.length));}
function dueItems(){var now=Date.now(),out=[];CORE.forEach(function(k){POOL[k].forEach(function(it){var r=rec(it.id);if(r.att&&r.due&&r.due<=now)out.push(it);});});return out;}
function nextDue(){var best=0;CORE.forEach(function(k){POOL[k].forEach(function(it){var r=rec(it.id);if(r.att&&r.due&&(!best||r.due<best))best=r.due;});});return best;}
function allAtTarget(){return M.length>0&&levels().every(function(l){return l>=TARGET;});}
function focusModule(){var ls=levels(),best=-1;ls.forEach(function(l,m){if(l<TARGET&&(best<0||l<ls[best]))best=m;});return best;}
/* A check earns credit only when it is clean (first try, no hint, no reveal) and
   at least GAP after the last credited check or the last time the answer was shown. */
function record(it,ok,aided){
  var before=levels(),r=S.items[it.id]||(S.items[it.id]={}),now=Date.now();
  r.att=(r.att||0)+1;
  if(ok&&!aided){
    if(now-Math.max(r.last||0,r.told||0)>=GAP){r.c=(r.c||0)+1;r.last=now;r.box=Math.min(5,(r.box||0)+1);r.due=now+iv(r.box);if(r.c>=2)delete r.pick;}
    else if(!r.due)r.due=now+GAP;
  }else{
    if(!ok){r.fail=(r.fail||0)+1;r.c=Math.max(0,(r.c||0)-1);}
    r.told=now;r.box=0;r.due=now+GAP;
  }
  save();
  levels().forEach(function(l,m){if(l!==before[m])UI.notice.push('Skill map: '+tag(m)+' moved '+before[m]+' → '+l+' ('+LV[l]+').');});
}

/* ---------- answer matching ---------- */
function norm(v){return String(v==null?'':v).toLowerCase().replace(/<->/g,'↔').replace(/->/g,'→').replace(/\s+/g,'').replace(/[.;,!]+$/,'');}
function match(it,v){
  var raw=String(v==null?'':v).trim(),n=norm(raw);if(!n)return false;
  return (it.accept||[]).some(function(a){
    a=String(a);
    if(a.indexOf('re:')===0){try{return new RegExp(a.slice(3),'i').test(raw);}catch(e){return false;}}
    if(a.indexOf('num:')===0){var p=a.slice(4).split('±'),x=parseFloat(p[0]),tol=parseFloat(p[1])||0,u=parseFloat(raw.replace(',','.'));return isFinite(u)&&Math.abs(u-x)<=tol+1e-12;}
    return norm(a)===n;
  });
}

/* ---------- runs (one question at a time) ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x;}return a;}
function ordered(list){
  var l=list.slice(),d=function(it){return it.difficulty||2;},f;
  if(S.diff==='easy'){f=l.filter(function(it){return d(it)<=2;});if(f.length)l=f;l.sort(function(a,b){return d(a)-d(b);});}
  else if(S.diff==='hard'){f=l.filter(function(it){return d(it)>=2;});if(f.length)l=f;l.sort(function(a,b){return d(b)-d(a);});}
  else l.sort(function(a,b){return d(a)-d(b);});
  return l;
}
function newRun(mode,items,key){return{mode:mode,key:key||'',ids:items.map(function(it){return it.id;}),pos:0,t:{},done:false,exam:mode==='diag'||mode==='final'||mode==='mock'};}
function tr(id){var R=UI.run;return R.t[id]||(R.t[id]={wrong:[],steps:0,ticks:{}});}
function finish(it,t,ok,aided){if(t.done)return;t.done=true;t.ok=ok;t.aided=!!aided;record(it,ok,aided);}
function finalItems(){
  var out=[];
  M.forEach(function(_,m){
    var pool=shuffle(modItems(m,['q','f'])).sort(function(a,b){return (b.difficulty||2)-(a.difficulty||2);});
    out=out.concat(shuffle(pool.slice(0,Math.max(2,Math.min(3,pool.length)))).slice(0,2));
  });
  return shuffle(out).concat(POOL.i.slice(0,3));
}
function examOk(it,t){
  if(it._t==='q'||it._t==='d')return t.pick===it.answer;
  if(it._t==='f')return match(it,t.val);
  if(it._t==='i'){var n=(it.rubric||[]).length,k=0;for(var j=0;j<n;j++)if(t.ticks[j])k++;return !!t.marked&&n>0&&k/n>=.7;}
  return false;
}
function scoreRun(){
  var R=UI.run,per={},right=0;
  R.ids.forEach(function(id){
    var it=BY[id],t=tr(id),ok=examOk(it,t);t.ok=ok;if(ok)right++;
    var ms=it._t==='i'?[]:[it.m];
    ms.forEach(function(m){per[m]=per[m]||{ok:0,n:0,hard:false};per[m].n++;if(ok){per[m].ok++;if((it.difficulty||2)>=3)per[m].hard=true;}});
    if(R.mode!=='diag'&&it._t!=='i'){if(!ok&&it._t==='q'&&t.pick!=null)(S.items[id]||(S.items[id]={})).pick=t.pick;record(it,ok,false);}
  });
  R.per=per;R.right=right;R.score=R.ids.length?right/R.ids.length:0;
  if(R.mode==='diag'){
    M.forEach(function(_,m){var p=per[m];S.place[m]=p&&p.ok?(p.hard||p.ok===p.n&&p.n>1?3:2):(p?1:0);});
    S.diag={at:Date.now(),score:R.score};
  }else{
    var every=M.every(function(_,m){return !per[m]||per[m].ok>0;});
    R.passed=R.score>=.8&&every;
    if(R.mode==='final')S.final={passed:R.passed||!!(S.final&&S.final.passed),score:R.score,at:Date.now()};
  }
  UI.notice=[];R.done=true;save();
}

  opt=opt||{};
  var main=document.getElementById('main'),body=VIEWS[UI.view]();
  main.innerHTML=crumb()+body;
  if(!opt.keepSide)document.getElementById('side').innerHTML=vSide();
  document.getElementById('tb-title').textContent=C.title||'';
  document.body.classList.toggle('menu-open',!!UI.menu);
  if(C.math&&window.renderMathInElement){try{window.renderMathInElement(main,{output:'mathml',throwOnError:false,delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}]});}catch(e){}}
  if(opt.anchor){var el=document.getElementById(opt.anchor);if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'start'});}
  else if(opt.top)window.scrollTo(0,0);
  if(opt.focus){var f=document.getElementById(opt.focus);if(f&&!f.disabled){f.focus();try{f.setSelectionRange(f.value.length,f.value.length);}catch(e){}}}
}
window.__render=function(){render();};
function go(view,o,opt){o=o||{};UI.notice=[];UI.menu=false;UI.confirmReset=false;UI.importMsg='';if(view!=='practice'||UI.view!=='practice')UI.run=null;UI.view=view;Object.keys(o).forEach(function(k){UI[k]=o[k];});if(view==='theory'&&!S.opened[UI.m]){S.opened[UI.m]=1;save();}render(opt||{top:true});}

/* ---------- actions ---------- */
function cur(){var R=UI.run;if(!R||R.done)return null;var it=BY[R.ids[R.pos]];return it?{R:R,it:it,t:tr(it.id)}:null;}
var ACT={
  menu:function(){UI.menu=!UI.menu;render();},
  go:function(d){go(d.v);},
  mod:function(d){go('theory',{m:+d.m});},
  sec:function(d){go('theory',{m:+d.m},{anchor:d.s});},
  prac:function(d){var m=+d.m,tab=d.tab||(POOL[UI.tab].some(function(it){return it.m===m;})?UI.tab:(TABS.filter(function(tb){return POOL[tb[0]].some(function(it){return it.m===m;});})[0]||['q'])[0]);go('practice',{m:m,tab:tab,all:false});},
  pall:function(d){go('practice',{tab:d.tab,all:true});},
  tab:function(d){UI.tab=d.tab;UI.notice=[];render();},
  scope:function(d){UI.all=d.all==='1';UI.notice=[];render();},
  diff:function(d){S.diff=d.d;save();UI.notice=[];render();},
  selftest:function(){S.selfTest=!S.selfTest;Object.keys(UI.unveil).forEach(function(k){if(k.indexOf(':r')<0)delete UI.unveil[k];});save();render();},
  unveil:function(d){UI.unveil[d.k]=1;render();},
  primer:function(){UI.primer[UI.m]=1;render();},
  print:function(){window.print();},
  start:function(d){
    var items=d.mode==='review'?shuffle(dueItems()).slice(0,20):(d.mode==='diag'?POOL.d.slice().sort(function(a,b){return (a.difficulty||2)-(b.difficulty||2);}):finalItems());
    UI.notice=[];UI.run=newRun(d.mode,items);render({top:true});
  },
  rerun:function(){UI.run=null;UI.notice=[];render({top:true});},
  prev:function(){var R=UI.run;if(R&&R.pos>0){R.pos--;UI.notice=[];render({top:true});}},
  next:function(){
    var R=UI.run;if(!R)return;UI.notice=[];
    if(R.pos<R.ids.length-1){R.pos++;render({top:true,focus:'ans'});}
    else if(R.exam){scoreRun();render({top:true});}
    else{R.done=true;render({top:true});}
  },
  pick:function(d){
    var c=cur();if(!c)return;var i=+d.i,it=c.it,t=c.t;
    if(c.R.exam){t.pick=i;render();return;}
    if(t.done)return;UI.notice=[];
    if(i===it.answer)finish(it,t,true,t.wrong.length>0);
    else{t.wrong.push(i);var r=S.items[it.id]||(S.items[it.id]={});r.pick=i;save();if(t.wrong.length>=2||it.options.length-t.wrong.length<=1)finish(it,t,false,false);}
    render();
  },
  defend:function(){var c=cur();if(c){c.t.defended=true;render();}},
  tell:function(){var c=cur();if(!c||c.t.done)return;UI.notice=[];c.t.told=true;finish(c.it,c.t,false,true);render();},
  hint:function(){var c=cur();if(c){c.t.hint=true;render({focus:'ans'});}},
  check:function(){
    var c=cur();if(!c||c.t.done||c.R.exam)return;var it=c.it,t=c.t;UI.notice=[];
    if(!String(t.val||'').trim()){render({focus:'ans'});return;}
    if(match(it,t.val))finish(it,t,true,!!(t.tries||t.hint));
    else{t.tries=(t.tries||0)+1;if(t.tries===1)t.hint=true;if(t.tries>=3)finish(it,t,false,false);}
    render({focus:'ans'});
  },
  flip:function(){var c=cur();if(c){c.t.flipped=!c.t.flipped;c.t.seen=true;render();}},
  known:function(){var c=cur();if(c){UI.notice=[];finish(c.it,c.t,true,false);render();}},
  again:function(){var c=cur();if(c){UI.notice=[];finish(c.it,c.t,false,false);render();}},
  wstep:function(){var c=cur();if(!c)return;var t=c.t;UI.notice=[];t.steps++;if(t.steps>=c.it.steps.length)finish(c.it,t,true,true);render();},
  wclaim:function(){var c=cur();if(c){c.t.claim=true;render();}},
  wyes:function(){var c=cur();if(c){UI.notice=[];finish(c.it,c.t,true,c.t.steps>0);render();}},
  wno:function(){var c=cur();if(c){UI.notice=[];finish(c.it,c.t,false,false);render();}},
  mark:function(){var c=cur();if(!c)return;var st=S.explain[c.it.id]||{};if(!String(st.text||'').trim()){render();return;}c.t.marking=true;render();},
  markdone:function(){
    var c=cur();if(!c)return;var it=c.it,t=c.t,n=(it.rubric||[]).length,k=0;for(var j=0;j<n;j++)if(t.ticks[j])k++;
    UI.notice=[];
    if(c.R.exam){t.marked=true;}else finish(it,t,n>0&&k===n,false);
    render();
  },
  copy:function(d){var el=document.getElementById(d.t);if(!el)return;el.select();copyText(el.value);},
  flag:function(){var c=cur();if(c){S.flags[c.it.id]={at:Date.now(),note:''};save();render();}},
  unflag:function(){var c=cur();if(c){delete S.flags[c.it.id];save();render();}},
  aimark:function(){var c=cur();if(c){copyText(markRequest(c.it));UI.notice=['Marking request copied. Paste it into your AI agent.'];render();}},
  backup:function(){if(!download('study-progress-'+(DATA.id||'course')+'.txt',saveCode())){UI.importMsg='Download is blocked here. Copy the code instead.';render();}},
  anki:function(){
    var clean=function(s){return String(s).replace(/[\t\r\n]+/g,' ');};
    var rows=POOL.fc.map(function(c){return [clean(c.front),clean(c.back),clean(M[c.m]?(M[c.m].short||M[c.m].title).replace(/\s+/g,'_'):'')].join('\t');});
    if(!download('flashcards-anki.tsv','#separator:tab\n#tags column:3\n'+rows.join('\n'),'text/tab-separated-values')){UI.importMsg='Download is blocked here.';render();}
  },
  'import':function(){
    var el=document.getElementById('loadcode'),raw=(el&&el.value||'').trim();
    try{var o=JSON.parse(decodeURIComponent(escape(atob(raw))));if(!o||!o.s||typeof o.s.items!=='object')throw 0;
      if(o.id&&DATA.id&&o.id!==DATA.id){UI.importMsg='That code belongs to a different course.';}
      else{S=Object.assign(blank(),o.s);save();UI.importMsg='Restored.';}
    }catch(e){UI.importMsg='That is not a valid saved state code.';}
    render();
  },
  reset1:function(){UI.confirmReset=true;render();},
  reset0:function(){UI.confirmReset=false;render();},
  reset2:function(){S=blank();save();UI.confirmReset=false;UI.unveil={};UI.primer={};render();}
};
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b||b.disabled)return;var fn=ACT[b.dataset.a];if(fn)fn(b.dataset);});
document.addEventListener('input',function(e){
  var el=e.target,c=cur();
  if(el.dataset&&el.dataset.in==='val'&&c)c.t.val=el.value;
  else if(el.dataset&&el.dataset.in==='text'&&c){(S.explain[c.it.id]||(S.explain[c.it.id]={})).text=el.value;save();}
  else if(el.dataset&&el.dataset.in==='flag'&&c&&S.flags[c.it.id]){S.flags[c.it.id].note=el.value;save();}
  else if(el.dataset&&el.dataset.in==='note'){S.notes[UI.m]=el.value;save();}
  else if(el.dataset&&el.dataset.in==='search'){UI.q=el.value;UI.view='search';UI.run=null;UI.notice=[];render({keepSide:true});}
});
document.addEventListener('change',function(e){
  var el=e.target,c=cur();
  if(el.dataset&&el.dataset.tick!=null&&c){c.t.ticks[el.dataset.tick]=el.checked;}
  else if(el.dataset&&el.dataset.ch==='exam'){S.exam=el.value||null;if(!el.value&&C.exam_date)S.exam='none';save();render();}
});
document.addEventListener('keydown',function(e){
  var tg=e.target,tn=tg&&tg.tagName,c=cur();
  if(e.key==='Enter'&&tg&&tg.id==='ans'){if(c&&c.R.exam)ACT.next();else ACT.check();return;}
  if(!c||tn==='INPUT'||tn==='TEXTAREA'||tn==='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(/^[1-6]$/.test(e.key)){var b=document.querySelectorAll('#main .opt')[+e.key-1];if(b&&!b.disabled){b.click();e.preventDefault();}}
  else if(e.key==='ArrowRight')ACT.next();
  else if(e.key==='ArrowLeft')ACT.prev();
  else if(e.key===' '&&c.it._t==='fc'&&tn!=='BUTTON'){ACT.flip();e.preventDefault();}
});
render();
})();
</script>
