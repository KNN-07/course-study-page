<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F6F6F3;--surface:#FFFFFF;--sunken:#FAFAF8;--ink:#17171A;--ink2:#33333A;--muted:#5C5C66;
  --line:#E3E3DE;--line2:#C9C9C2;--track:#EEEEEA;
  --accent:var(--course-accent,#3651D4);--accent-ink:#FFFFFF;--accent-tint:#EEF1FD;--accent-tint-ink:#1F2E80;
  --ok-bg:#E8F5EE;--ok:#155C3A;--ok-line:#1E7B4F;--bad-bg:#FCECEA;--bad:#8E1D17;--bad-line:#B3261E;
  --warn-bg:#FDF1E8;--warn:#8A3B0B;--warn-line:#E8C3A8;--inv-bg:#17171A;--inv-ink:#FFFFFF;--inv-muted:#CFCFD6;--inv-line:#4A4A52;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--display:'Space Grotesk','Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121214;--surface:#1C1C20;--sunken:#18181B;--ink:#F1F1EE;--ink2:#D2D2D6;--muted:#A3A3AD;
    --line:#2E2E34;--line2:#4A4A52;--track:#2A2A30;
    --accent:#93A5FF;--accent-ink:#0E1433;--accent-tint:#232A52;--accent-tint-ink:#C9D2FA;
    --ok-bg:#15301F;--ok:#8FD9AE;--ok-line:#3FA772;--bad-bg:#3A1A18;--bad:#F3A6A0;--bad-line:#D0554C;
    --warn-bg:#3A2613;--warn:#F0B98A;--warn-line:#7A4A22;--inv-bg:#26262B;--inv-ink:#FFFFFF;--inv-muted:#CFCFD6;--inv-line:#5A5A64;
  }
}
:root[data-theme="dark"]{
  --bg:#121214;--surface:#1C1C20;--sunken:#18181B;--ink:#F1F1EE;--ink2:#D2D2D6;--muted:#A3A3AD;
  --line:#2E2E34;--line2:#4A4A52;--track:#2A2A30;
  --accent:#93A5FF;--accent-ink:#0E1433;--accent-tint:#232A52;--accent-tint-ink:#C9D2FA;
  --ok-bg:#15301F;--ok:#8FD9AE;--ok-line:#3FA772;--bad-bg:#3A1A18;--bad:#F3A6A0;--bad-line:#D0554C;
  --warn-bg:#3A2613;--warn:#F0B98A;--warn-line:#7A4A22;--inv-bg:#26262B;--inv-ink:#FFFFFF;--inv-muted:#CFCFD6;--inv-line:#5A5A64;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
p{margin:0}
h1,h2,h3{font-family:var(--display);margin:0}
h1{font-size:clamp(28px,5vw,40px);line-height:1.1;font-weight:700;letter-spacing:-0.01em}
h2{font-size:clamp(22px,4vw,30px);line-height:1.15;font-weight:700}
h3{font-size:20px;font-weight:600}
code{font-family:var(--mono);font-size:.92em;background:var(--track);border-radius:5px;padding:1px 5px}
pre{margin:6px 0;padding:12px 14px;background:var(--sunken);border:1px solid var(--line);border-radius:10px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.5;text-align:left}
pre code{background:none;padding:0}
.app{display:flex;min-height:100vh;align-items:stretch}
aside{flex:0 0 292px;background:var(--surface);border-right:1px solid var(--line);padding:26px 16px 40px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.wrap{flex:1 1 auto;min-width:0;padding:30px 40px 80px}
main{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.topbar{display:none}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.brand{display:flex;flex-direction:column;gap:6px;padding:0 10px}
.ctitle{font-family:var(--display);font-size:19px;line-height:1.25;font-weight:700}
.bar{height:6px;background:var(--track);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
nav{display:flex;flex-direction:column;gap:18px}
nav .grp{display:flex;flex-direction:column;gap:2px}
nav .eyebrow{padding:0 10px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 10px;border:0;border-radius:8px;background:transparent;text-align:left;font-size:14px;line-height:1.3;font-weight:500;color:var(--ink)}
.row:hover{background:var(--track)}
.row.on{background:var(--accent-tint);color:var(--accent-tint-ink);font-weight:600}
.row .grow{flex:1 1 auto;min-width:0}
.row .cnt{font-size:12px;color:var(--muted);white-space:nowrap}
.row.on .cnt{color:inherit}
.num{flex:0 0 auto;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:12px;background:var(--track);color:var(--ink2)}
.row.open .num{background:var(--accent);color:var(--accent-ink)}
.subs{margin:0 0 8px 23px;border-left:1px solid var(--line);display:flex;flex-direction:column}
.sub{min-height:38px;padding:7px 12px;border:0;border-left:2px solid transparent;margin-left:-1px;background:transparent;text-align:left;font-size:13px;font-weight:500;color:var(--muted)}
.sub:hover{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.card.inv{background:var(--inv-bg);color:var(--inv-ink);border-color:var(--inv-bg)}
.card.inv .muted{color:var(--inv-muted)}
.card.dashed{border-style:dashed;color:var(--muted)}
.grid{display:grid;gap:12px}
.g-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-mods{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g-con{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g-two{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:24px;font-weight:600}
.modcard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);min-height:140px}
.modcard:hover{border-color:var(--line2)}
.modcard .n{font-family:var(--display);font-size:14px;font-weight:600;color:var(--accent)}
.modcard .t{font-family:var(--display);font-size:18px;font-weight:600;line-height:1.25}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:14px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.5}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.okb{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok);font-weight:600}
.btn.warnb{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);text-decoration:underline}
.card.inv .btn:not(.pri){background:#34343A;border-color:var(--inv-line);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--track);padding:4px;border-radius:12px}
.seg button{min-height:40px;padding:0 14px;border-radius:9px;border:0;background:transparent;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--accent-tint);color:var(--accent-tint-ink);white-space:nowrap}
.chip.plain{background:var(--track);color:var(--ink2)}
.q{font-size:17px;font-weight:600;line-height:1.45}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 14px;border-radius:10px;text-align:left;font-size:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .let{flex:0 0 auto;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--track);color:var(--ink2)}
.opt.sel{border-color:var(--accent);background:var(--accent-tint);color:var(--accent-tint-ink)}
.opt.sel .let{background:var(--accent);color:var(--accent-ink)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.opt.ok .let{background:var(--ok-line);color:#fff}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.opt.bad .let{background:var(--bad-line);color:#fff}
.fb{padding:12px 14px;border-radius:10px;font-size:14px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.info{background:var(--accent-tint);color:var(--accent-tint-ink)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.inp{flex:1 1 240px;min-width:0;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-family:var(--mono);font-size:15px}
textarea.inp{width:100%;min-height:130px;padding:12px 14px;font-family:var(--sans);line-height:1.5;resize:vertical;flex:none}
textarea.code{font-family:var(--mono);font-size:12px;min-height:110px}
.flash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;width:100%;min-height:280px;padding:36px 28px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.flash.back{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flash .big{font-family:var(--display);font-size:clamp(20px,3.6vw,28px);line-height:1.3;font-weight:600;max-width:820px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:12px 14px}
.steps .sn{flex:0 0 auto;width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.steps .sb{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.concept{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.concept .term{font-family:var(--display);font-weight:600;font-size:17px}
.concept .ex{margin-top:auto;font-family:var(--mono);font-size:13px;background:var(--accent-tint);color:var(--accent-tint-ink);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{padding:10px 12px;font-family:var(--mono);font-size:13px;font-weight:500;background:var(--inv-bg);color:var(--inv-ink);text-align:left;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--track);font-family:var(--mono);vertical-align:top}
td:first-child{font-family:var(--sans);font-weight:600}
tr:nth-child(even) td{background:var(--sunken)}
td.t,td.f{text-align:center;font-family:var(--mono);font-weight:500}
tr td.t{background:var(--ok-bg);color:var(--ok)}
tr td.f{background:var(--bad-bg);color:var(--bad)}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink2)}
.map{display:flex;flex-direction:column;gap:2px}
.maprow{display:grid;grid-template-columns:minmax(0,1.3fr) 110px 34px minmax(0,1fr);gap:12px;align-items:center;padding:8px 10px;border:0;border-radius:8px;background:transparent;text-align:left;font-size:14px;min-height:44px;width:100%}
.maprow:hover{background:var(--track)}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.segs i{height:10px;border-radius:2px;background:var(--track)}
.segs i.on{background:var(--accent)}
.segs i.tg{box-shadow:inset 0 0 0 1px var(--line2)}
.kv{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;border-top:1px solid var(--track);padding-top:8px}
.kv span:first-child{font-size:13px;color:var(--muted)}
.kv span:last-child{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--track)}
.check input{width:20px;height:20px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--accent)}
[id^="sec-"]{scroll-margin-top:20px}
figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
figure img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
figcaption{font-size:13px;color:var(--muted)}
.search{width:100%;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);font-size:14px}
.prose{display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.7;color:var(--ink2)}
.prose h4{margin:10px 0 0;font-family:var(--display);font-size:18px;font-weight:600;color:var(--ink)}
.prose ol.plain,.prose ul.plain{gap:8px}
ol.plain{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;color:var(--ink2)}
.hit{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:44px}
.hit:hover{border-color:var(--line2)}
@media (max-width:860px){
  .app{display:block}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px}
  .topbar b{font-family:var(--display);font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  aside{display:none;position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  body.menu-open aside{display:flex}
  body.menu-open .wrap{display:none}
  .wrap{padding:20px 16px 64px}
  .opts{grid-template-columns:1fr}
  .maprow{grid-template-columns:minmax(0,1fr) 80px 30px}
  .maprow .st{display:none}
  .card{padding:18px 16px}
}
@media print{aside,.topbar,.noprint{display:none!important}.wrap{padding:0}body{background:#fff}}
</style>
__HEAD_EXTRA__

<body>
<div class="app">
  <div class="topbar"><b id="tb-title"></b><button class="btn" data-a="menu" aria-controls="side">Menu</button></div>
  <aside id="side" aria-label="Course navigation"></aside>
  <div class="wrap"><main id="main"></main></div>
</div>
<script id="course-data" type="application/json">__COURSE_JSON__</script>
<script>
(function(){
'use strict';
var DATA=JSON.parse(document.getElementById('course-data').textContent);
var C=DATA.course||{}, M=DATA.modules||[];
var POOL={q:DATA.quiz||[],f:DATA.fill||[],fc:DATA.flashcards||[],w:DATA.worked||[],x:DATA.explain||[],d:DATA.diagnostic||[],i:DATA.integrative||[]};
var BY={};Object.keys(POOL).forEach(function(k){POOL[k].forEach(function(it,n){it._t=k;if(!it.id)it.id=k+'-'+n;BY[it.id]=it;});});
var CORE=['q','f','fc','w'];
var TARGET=Math.min(5,Math.max(1,C.target_level||4));
var MIN=60e3,GAP=10*MIN,DAY=864e5,IV=[GAP,GAP,DAY,3*DAY,7*DAY,16*DAY];
var LV=['unaware','heard of it','can follow along','can do with help','can do independently','can teach it'];
var KIND={predict:'Predict',explain:'Explain why',flaw:'Find the flaw',apply:'Apply',connect:'Connect',recall:'Recall'};
var TABS=[['q','Quiz'],['f','Short answer'],['fc','Flashcards'],['w','Worked problems'],['x','Teach it back']];
var LET='ABCDEFGH';
if(C.accent&&/^#[0-9a-fA-F]{6}$/.test(C.accent))document.documentElement.style.setProperty('--course-accent',C.accent);

/* ---------- state ---------- */
var KEY='course-study:'+(DATA.id||C.title||'course');
function blank(){return{v:1,items:{},place:{},diag:null,final:null,opened:{},explain:{},diff:'std',selfTest:false,exam:null,flags:{},notes:{}};}
function load(){try{var r=localStorage.getItem(KEY);if(r)return Object.assign(blank(),JSON.parse(r));}catch(e){}return blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load();
var UI={view:'overview',m:0,tab:'q',all:false,run:null,menu:false,unveil:{},primer:{},notice:[],confirmReset:false,importMsg:''};

/* ---------- text ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function T(s){var h=esc(s);
  h=h.replace(/```[\w+-]*\n?([\s\S]*?)```/g,function(_,c){return '<pre><code>'+c.replace(/\n$/,'')+'</code></pre>';});
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s](?:[^*\n]*[^*\s])?)\*(?=[\s.,;:!?)]|$)/g,'$1<em>$2</em>');
  return h.replace(/\n/g,'<br>');}
/* block text for lessons: paragraphs, - lists, 1. lists, > callouts, ### headings, fenced code */
function B(s){
  var out=[];
  String(s==null?'':s).replace(/\r/g,'').split('```').forEach(function(seg,i){
    if(i%2){out.push('<pre><code>'+esc(seg.replace(/^[\w+-]*\n/,'').replace(/\n$/,''))+'</code></pre>');return;}
    seg.split(/\n\s*\n/).forEach(function(blk){
      blk=blk.replace(/^\n+|\n+$/g,'');if(!blk)return;
      var lines=blk.split('\n'),all=function(re){return lines.every(function(l){return re.test(l);});},strip=function(re){return lines.map(function(l){return l.replace(re,'');});};
      if(all(/^\s*[-*•]\s+/))out.push('<ul class="plain">'+strip(/^\s*[-*•]\s+/).map(function(l){return '<li>'+T(l)+'</li>';}).join('')+'</ul>');
      else if(all(/^\s*\d+[.)]\s+/))out.push('<ol class="plain">'+strip(/^\s*\d+[.)]\s+/).map(function(l){return '<li>'+T(l)+'</li>';}).join('')+'</ol>');
      else if(all(/^>\s?/))out.push('<p class="fb info">'+T(strip(/^>\s?/).join('\n'))+'</p>');
      else if(lines.length===1&&/^#{1,4}\s+/.test(blk))out.push('<h4>'+T(blk.replace(/^#+\s+/,''))+'</h4>');
      else out.push('<p>'+T(blk)+'</p>');
    });
  });
  return out.join('');
}
function words(s){return String(s||'').split(/\s+/).filter(Boolean).length;}
function pad(n){return String(n+1).padStart(2,'0');}
function tag(m){return M[m]?'M'+(m+1)+' · '+esc(M[m].short||M[m].title):'Whole course';}
function fig(f){if(!f||!f.src||!/^(data:image\/|https:\/\/)/.test(f.src))return '';return '<figure><img src="'+esc(f.src)+'" alt="'+esc(f.alt||'')+'" loading="lazy">'+(f.caption?'<figcaption>'+T(f.caption)+'</figcaption>':'')+'</figure>';}
function copyText(s){
  function fb(){try{var a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}catch(e){}}
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).catch(fb);else fb();}catch(e){fb();}
}
function download(name,text,mime){
  try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove();return true;}catch(e){return false;}
}
function plain(it){return String(it.q||it.prompt||it.front||it.title||'').replace(/\s+/g,' ');}
/* exam date: compresses the review schedule so every item returns before the exam */
function examTs(){var d=S.exam||C.exam_date;if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return 0;var p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2],9).getTime();}
function timeLeft(){var e=examTs();return e?e-Date.now():0;}
function iv(box){var base=IV[box],left=timeLeft();return left>0?Math.max(GAP,Math.min(base,left*[.02,.02,.1,.25,.5,.8][box])):base;}
function ago(ms){var m=Math.round(ms/MIN);if(m<60)return m+' min';var h=Math.round(m/60);if(h<48)return h+' h';return Math.round(h/24)+' days';}

/* ---------- mastery model ---------- */
function rec(id){return S.items[id]||{};}
function cnt(id){return rec(id).c||0;}
function modItems(m,types){var out=[];(types||CORE).forEach(function(k){POOL[k].forEach(function(it){if(it.m===m)out.push(it);});});return out;}
function evidence(m){
  var its=modItems(m),lvl=0;
  if(S.opened[m]||its.some(function(it){return rec(it.id).att;}))lvl=1;
  if(!its.length)return lvl;
  var c1=its.filter(function(it){return cnt(it.id)>=1;}).length/its.length;
  var c2=its.filter(function(it){return cnt(it.id)>=2;}).length/its.length;
  if(c1>=.5)lvl=2;
  if(c1>=.8)lvl=3;
  var wk=POOL.w.filter(function(it){return it.m===m;});
  if(c2>=.8&&(!wk.length||wk.some(function(it){return cnt(it.id)>=1;})))lvl=4;
  if(lvl===4){
    var hard=its.filter(function(it){return (it.difficulty||2)>=3;}),ex=POOL.x.filter(function(it){return it.m===m;});
    if((hard.length||ex.length)&&hard.every(function(it){return cnt(it.id)>=2;})&&ex.every(function(it){return cnt(it.id)>=1;}))lvl=5;
  }
  return lvl;
}
function level(m){return Math.max(evidence(m),Math.min(3,S.place[m]||0));}
function levels(){return M.map(function(_,m){return level(m);});}
function overallPct(){if(!M.length)return 0;var s=0;levels().forEach(function(l){s+=Math.min(l,TARGET);});return Math.round(100*s/(TARGET*M.length));}
function dueItems(){var now=Date.now(),out=[];CORE.forEach(function(k){POOL[k].forEach(function(it){var r=rec(it.id);if(r.att&&r.due&&r.due<=now)out.push(it);});});return out;}
function nextDue(){var best=0;CORE.forEach(function(k){POOL[k].forEach(function(it){var r=rec(it.id);if(r.att&&r.due&&(!best||r.due<best))best=r.due;});});return best;}
function allAtTarget(){return M.length>0&&levels().every(function(l){return l>=TARGET;});}
function focusModule(){var ls=levels(),best=-1;ls.forEach(function(l,m){if(l<TARGET&&(best<0||l<ls[best]))best=m;});return best;}
/* A check earns credit only when it is clean (first try, no hint, no reveal) and
   at least GAP after the last credited check or the last time the answer was shown. */
function record(it,ok,aided){
  var before=levels(),r=S.items[it.id]||(S.items[it.id]={}),now=Date.now();
  r.att=(r.att||0)+1;
  if(ok&&!aided){
    if(now-Math.max(r.last||0,r.told||0)>=GAP){r.c=(r.c||0)+1;r.last=now;r.box=Math.min(5,(r.box||0)+1);r.due=now+iv(r.box);if(r.c>=2)delete r.pick;}
    else if(!r.due)r.due=now+GAP;
  }else{
    if(!ok){r.fail=(r.fail||0)+1;r.c=Math.max(0,(r.c||0)-1);}
    r.told=now;r.box=0;r.due=now+GAP;
  }
  save();
  levels().forEach(function(l,m){if(l!==before[m])UI.notice.push('Skill map: '+tag(m)+' moved '+before[m]+' → '+l+' ('+LV[l]+').');});
}

/* ---------- answer matching ---------- */
function norm(v){return String(v==null?'':v).toLowerCase().replace(/<->/g,'↔').replace(/->/g,'→').replace(/\s+/g,'').replace(/[.;,!]+$/,'');}
function match(it,v){
  var raw=String(v==null?'':v).trim(),n=norm(raw);if(!n)return false;
  return (it.accept||[]).some(function(a){
    a=String(a);
    if(a.indexOf('re:')===0){try{return new RegExp(a.slice(3),'i').test(raw);}catch(e){return false;}}
    if(a.indexOf('num:')===0){var p=a.slice(4).split('±'),x=parseFloat(p[0]),tol=parseFloat(p[1])||0,u=parseFloat(raw.replace(',','.'));return isFinite(u)&&Math.abs(u-x)<=tol+1e-12;}
    return norm(a)===n;
  });
}

/* ---------- runs (one question at a time) ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x;}return a;}
function ordered(list){
  var l=list.slice(),d=function(it){return it.difficulty||2;},f;
  if(S.diff==='easy'){f=l.filter(function(it){return d(it)<=2;});if(f.length)l=f;l.sort(function(a,b){return d(a)-d(b);});}
  else if(S.diff==='hard'){f=l.filter(function(it){return d(it)>=2;});if(f.length)l=f;l.sort(function(a,b){return d(b)-d(a);});}
  else l.sort(function(a,b){return d(a)-d(b);});
  return l;
}
function newRun(mode,items,key){return{mode:mode,key:key||'',ids:items.map(function(it){return it.id;}),pos:0,t:{},done:false,exam:mode==='diag'||mode==='final'||mode==='mock'};}
function tr(id){var R=UI.run;return R.t[id]||(R.t[id]={wrong:[],steps:0,ticks:{}});}
function finish(it,t,ok,aided){if(t.done)return;t.done=true;t.ok=ok;t.aided=!!aided;record(it,ok,aided);}
function finalItems(){
  var out=[];
  M.forEach(function(_,m){
    var pool=shuffle(modItems(m,['q','f'])).sort(function(a,b){return (b.difficulty||2)-(a.difficulty||2);});
    out=out.concat(shuffle(pool.slice(0,Math.max(2,Math.min(3,pool.length)))).slice(0,2));
  });
  return shuffle(out).concat(POOL.i.slice(0,3));
}
function examOk(it,t){
  if(it._t==='q'||it._t==='d')return t.pick===it.answer;
  if(it._t==='f')return match(it,t.val);
  if(it._t==='i'){var n=(it.rubric||[]).length,k=0;for(var j=0;j<n;j++)if(t.ticks[j])k++;return !!t.marked&&n>0&&k/n>=.7;}
  return false;
}
function scoreRun(){
  var R=UI.run,per={},right=0;
  R.ids.forEach(function(id){
    var it=BY[id],t=tr(id),ok=examOk(it,t);t.ok=ok;if(ok)right++;
    var ms=it._t==='i'?[]:[it.m];
    ms.forEach(function(m){per[m]=per[m]||{ok:0,n:0,hard:false};per[m].n++;if(ok){per[m].ok++;if((it.difficulty||2)>=3)per[m].hard=true;}});
    if(R.mode!=='diag'&&it._t!=='i'){if(!ok&&it._t==='q'&&t.pick!=null)(S.items[id]||(S.items[id]={})).pick=t.pick;record(it,ok,false);}
  });
  R.per=per;R.right=right;R.score=R.ids.length?right/R.ids.length:0;
  if(R.mode==='diag'){
    M.forEach(function(_,m){var p=per[m];S.place[m]=p&&p.ok?(p.hard||p.ok===p.n&&p.n>1?3:2):(p?1:0);});
    S.diag={at:Date.now(),score:R.score};
  }else{
    var every=M.every(function(_,m){return !per[m]||per[m].ok>0;});
    R.passed=R.score>=.8&&every;
    if(R.mode==='final')S.final={passed:R.passed||!!(S.final&&S.final.passed),score:R.score,at:Date.now()};
  }
  UI.notice=[];R.done=true;save();
}

  h+='<div class="card"><h3>Misses to revisit</h3>'+(mis.length?'<ul class="plain">'+mis.slice(0,30).map(function(x){var it=x.it;return '<li><span class="chip plain">'+tag(it.m)+'</span> '+T(it.q||it.prompt||it.title)+(it._t==='q'&&x.r.pick!=null?'<br><span class="small muted">You chose: '+T(it.options[x.r.pick])+'</span>':'')+'</li>';}).join('')+'</ul>':'<p class="muted">None recorded.</p>')+'</div>';
  h+='<div class="card"><h3>Save state</h3><p class="small muted">Progress is kept in this browser only. Copy this code to move it to another device or keep a backup.</p><textarea class="inp code" id="savecode" readonly aria-label="Saved state code">'+esc(saveCode())+'</textarea><div class="btns"><button class="btn" data-a="copy" data-t="savecode">Copy code</button><button class="btn" data-a="backup">Download backup file</button><button class="btn" data-a="anki">Export flashcards for Anki</button></div>';
  h+='<h3 style="margin-top:8px">Resume from</h3><textarea class="inp code" id="loadcode" aria-label="Paste a saved state code" placeholder="Paste a saved state code"></textarea><div class="btns"><button class="btn" data-a="import">Restore</button>'+(UI.importMsg?'<span class="small">'+esc(UI.importMsg)+'</span>':'')+'</div></div>';
  h+='<h2 style="margin-top:8px">Send back to your AI agent</h2><p class="small muted" style="margin-top:-12px">This page cannot write new questions or read your written answers. The agent that built it can. Paste one of these into it.</p>';
  h+=copyBlock('handoff','Live tutoring','Continue with one-question-at-a-time tutoring on the weak spots.',handoff(),200);
  h+=copyBlock('more','More questions','Once you start recognising the questions, ask for fresh ones on your weak modules. Your progress on existing items is kept.',moreRequest());
  var fr=flagReport();
  h+=fr?copyBlock('flags','Flagged questions ('+Object.keys(S.flags).length+')','Questions you marked as wrong or unclear, for the agent to check against the materials.',fr):'<div class="card"><h3>Flagged questions</h3><p class="muted">None. Use "Flag this question" under any practice item that looks wrong.</p></div>';
  h+='<div class="card"><h3>Reset</h3><div class="btns">'+(UI.confirmReset?'<span class="small">Erase all progress for this course?</span><button class="btn warnb" data-a="reset2">Yes, erase</button><button class="btn" data-a="reset0">Cancel</button>':'<button class="btn" data-a="reset1">Reset progress</button>')+'</div></div>';
  return h+'</section>';
}
var VIEWS={search:vSearch,overview:vOverview,theory:vTheory,practice:vPractice,review:vReview,diag:vDiag,final:vFinal,sheet:vSheet,progress:vProgress};
var NAMES={search:['Reference','Search'],overview:['Course','Overview'],practice:['Practice',''],review:['Practice','Review queue'],diag:['Assessment','Diagnostic'],final:['Assessment','Final assessment'],sheet:['Reference','Cheat sheet'],progress:['Reference','Progress and saved state']};
function crumb(){
  var c=UI.view==='theory'?['Module '+(UI.m+1),M[UI.m].title]:NAMES[UI.view];
  if(UI.view==='practice')c=['Practice',(TABS.filter(function(t){return t[0]===UI.tab;})[0]||['',''])[1]];
  var h='<p class="small muted">'+esc(c[0])+' <span aria-hidden="true">/</span> <strong style="color:var(--ink);font-weight:600">'+esc(c[1])+'</strong></p>';
  UI.notice.forEach(function(n){h+='<p class="fb info" role="status">'+esc(n)+'</p>';});
  return h;
}
function vSide(){
  var ls=levels(),due=dueItems().length,v=UI.view;
  function row(on,attrs,inner,cls){return '<button class="row'+(on?' on':'')+(cls||'')+'" '+attrs+(on?' aria-current="page"':'')+'>'+inner+'</button>';}
  var h='<div class="brand">'+(C.code?'<p class="eyebrow">'+esc(C.code)+'</p>':'')+'<p class="ctitle">'+esc(C.title)+'</p><div class="bar" style="margin-top:8px"><i style="width:'+overallPct()+'%"></i></div><p class="tiny muted">'+overallPct()+'% to target'+(due?' · '+due+' due':'')+'</p><input class="search" type="search" data-in="search" value="'+esc(UI.q||'')+'" placeholder="Search notes" aria-label="Search notes" style="margin-top:8px"></div><nav aria-label="Table of contents">';
  h+='<div class="grp">'+row(v==='overview','data-a="go" data-v="overview"','Course overview')+'</div>';
  h+='<div class="grp"><p class="eyebrow">Modules</p>';
  M.forEach(function(mod,m){
    var open=m===UI.m&&(v==='theory'||(v==='practice'&&!UI.all));
    h+=row(open&&v==='theory','data-a="mod" data-m="'+m+'" aria-expanded="'+open+'"','<span class="num">'+pad(m)+'</span><span class="grow">'+esc(mod.title)+'</span><span class="cnt">'+ls[m]+'/5</span>',open?' open':'');
    if(open){
      h+='<div class="subs"><button class="sub" data-a="sec" data-m="'+m+'" data-s="sec-summary">Summary</button>';
      if((mod.reading||[]).length)h+='<button class="sub" data-a="sec" data-m="'+m+'" data-s="sec-reading">Lesson</button>';
      if((mod.concepts||[]).length)h+='<button class="sub" data-a="sec" data-m="'+m+'" data-s="sec-key">Key ideas</button>';
      var tb=tablesOf(mod)[0];if(tb)h+='<button class="sub" data-a="sec" data-m="'+m+'" data-s="sec-table">'+esc(tb.toc||'Table')+'</button>';
      h+='<button class="sub" data-a="sec" data-m="'+m+'" data-s="sec-pitfalls">Pitfalls</button><button class="sub" data-a="prac" data-m="'+m+'"'+(v==='practice'?' style="color:var(--accent);font-weight:600;border-left-color:var(--accent)"':'')+'>Practice ('+modItems(m,['q','f','fc','w','x']).length+')</button></div>';
    }
  });
  h+='</div><div class="grp"><p class="eyebrow">Practice</p>'+row(v==='review','data-a="go" data-v="review"','<span class="grow">Review queue</span><span class="cnt">'+due+' due</span>');
  TABS.forEach(function(tb){if(POOL[tb[0]].length)h+=row(v==='practice'&&UI.tab===tb[0]&&UI.all,'data-a="pall" data-tab="'+tb[0]+'"','<span class="grow">'+tb[1]+'</span><span class="cnt">'+POOL[tb[0]].length+'</span>');});
  h+='</div><div class="grp"><p class="eyebrow">Assessment</p>';
  if(POOL.d.length)h+=row(v==='diag','data-a="go" data-v="diag"','<span class="grow">Diagnostic</span><span class="cnt">'+(S.diag?'done':'start here')+'</span>');
  h+=row(v==='final','data-a="go" data-v="final"','<span class="grow">Final assessment</span><span class="cnt">'+(S.final&&S.final.passed?'passed':(allAtTarget()?'ready':'locked'))+'</span>');
  h+='</div><div class="grp"><p class="eyebrow">Reference</p>'+row(v==='sheet','data-a="go" data-v="sheet"','Cheat sheet')+row(v==='progress','data-a="go" data-v="progress"','Progress and saved state')+'</div></nav>';
  return h;
}
function render(opt){
  opt=opt||{};
  var main=document.getElementById('main'),body=VIEWS[UI.view]();
  main.innerHTML=crumb()+body;
  if(!opt.keepSide)document.getElementById('side').innerHTML=vSide();
  document.getElementById('tb-title').textContent=C.title||'';
  document.body.classList.toggle('menu-open',!!UI.menu);
  if(C.math&&window.renderMathInElement){try{window.renderMathInElement(main,{output:'mathml',throwOnError:false,delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}]});}catch(e){}}
  if(opt.anchor){var el=document.getElementById(opt.anchor);if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'start'});}
  else if(opt.top)window.scrollTo(0,0);
  if(opt.focus){var f=document.getElementById(opt.focus);if(f&&!f.disabled){f.focus();try{f.setSelectionRange(f.value.length,f.value.length);}catch(e){}}}
}
window.__render=function(){render();};
function go(view,o,opt){o=o||{};UI.notice=[];UI.menu=false;UI.confirmReset=false;UI.importMsg='';if(view!=='practice'||UI.view!=='practice')UI.run=null;UI.view=view;Object.keys(o).forEach(function(k){UI[k]=o[k];});if(view==='theory'&&!S.opened[UI.m]){S.opened[UI.m]=1;save();}render(opt||{top:true});}

/* ---------- actions ---------- */
function cur(){var R=UI.run;if(!R||R.done)return null;var it=BY[R.ids[R.pos]];return it?{R:R,it:it,t:tr(it.id)}:null;}
var ACT={
  menu:function(){UI.menu=!UI.menu;render();},
  go:function(d){go(d.v);},
  mod:function(d){go('theory',{m:+d.m});},
  sec:function(d){go('theory',{m:+d.m},{anchor:d.s});},
  prac:function(d){var m=+d.m,tab=d.tab||(POOL[UI.tab].some(function(it){return it.m===m;})?UI.tab:(TABS.filter(function(tb){return POOL[tb[0]].some(function(it){return it.m===m;});})[0]||['q'])[0]);go('practice',{m:m,tab:tab,all:false});},
  pall:function(d){go('practice',{tab:d.tab,all:true});},
  tab:function(d){UI.tab=d.tab;UI.notice=[];render();},
  scope:function(d){UI.all=d.all==='1';UI.notice=[];render();},
  diff:function(d){S.diff=d.d;save();UI.notice=[];render();},
  selftest:function(){S.selfTest=!S.selfTest;Object.keys(UI.unveil).forEach(function(k){if(k.indexOf(':r')<0)delete UI.unveil[k];});save();render();},
  unveil:function(d){UI.unveil[d.k]=1;render();},
  primer:function(){UI.primer[UI.m]=1;render();},
  print:function(){window.print();},
  start:function(d){
    var items=d.mode==='review'?shuffle(dueItems()).slice(0,20):(d.mode==='diag'?POOL.d.slice().sort(function(a,b){return (a.difficulty||2)-(b.difficulty||2);}):finalItems());
    UI.notice=[];UI.run=newRun(d.mode,items);render({top:true});
  },
  rerun:function(){UI.run=null;UI.notice=[];render({top:true});},
  prev:function(){var R=UI.run;if(R&&R.pos>0){R.pos--;UI.notice=[];render({top:true});}},
  next:function(){
    var R=UI.run;if(!R)return;UI.notice=[];
    if(R.pos<R.ids.length-1){R.pos++;render({top:true,focus:'ans'});}
    else if(R.exam){scoreRun();render({top:true});}
    else{R.done=true;render({top:true});}
  },
  pick:function(d){
    var c=cur();if(!c)return;var i=+d.i,it=c.it,t=c.t;
    if(c.R.exam){t.pick=i;render();return;}
    if(t.done)return;UI.notice=[];
    if(i===it.answer)finish(it,t,true,t.wrong.length>0);
    else{t.wrong.push(i);var r=S.items[it.id]||(S.items[it.id]={});r.pick=i;save();if(t.wrong.length>=2||it.options.length-t.wrong.length<=1)finish(it,t,false,false);}
    render();
  },
  defend:function(){var c=cur();if(c){c.t.defended=true;render();}},
  tell:function(){var c=cur();if(!c||c.t.done)return;UI.notice=[];c.t.told=true;finish(c.it,c.t,false,true);render();},
  hint:function(){var c=cur();if(c){c.t.hint=true;render({focus:'ans'});}},
  check:function(){
    var c=cur();if(!c||c.t.done||c.R.exam)return;var it=c.it,t=c.t;UI.notice=[];
    if(!String(t.val||'').trim()){render({focus:'ans'});return;}
    if(match(it,t.val))finish(it,t,true,!!(t.tries||t.hint));
    else{t.tries=(t.tries||0)+1;if(t.tries===1)t.hint=true;if(t.tries>=3)finish(it,t,false,false);}
    render({focus:'ans'});
  },
  flip:function(){var c=cur();if(c){c.t.flipped=!c.t.flipped;c.t.seen=true;render();}},
  known:function(){var c=cur();if(c){UI.notice=[];finish(c.it,c.t,true,false);render();}},
  again:function(){var c=cur();if(c){UI.notice=[];finish(c.it,c.t,false,false);render();}},
  wstep:function(){var c=cur();if(!c)return;var t=c.t;UI.notice=[];t.steps++;if(t.steps>=c.it.steps.length)finish(c.it,t,true,true);render();},
  wclaim:function(){var c=cur();if(c){c.t.claim=true;render();}},
  wyes:function(){var c=cur();if(c){UI.notice=[];finish(c.it,c.t,true,c.t.steps>0);render();}},
  wno:function(){var c=cur();if(c){UI.notice=[];finish(c.it,c.t,false,false);render();}},
  mark:function(){var c=cur();if(!c)return;var st=S.explain[c.it.id]||{};if(!String(st.text||'').trim()){render();return;}c.t.marking=true;render();},
  markdone:function(){
    var c=cur();if(!c)return;var it=c.it,t=c.t,n=(it.rubric||[]).length,k=0;for(var j=0;j<n;j++)if(t.ticks[j])k++;
    UI.notice=[];
    if(c.R.exam){t.marked=true;}else finish(it,t,n>0&&k===n,false);
    render();
  },
  copy:function(d){var el=document.getElementById(d.t);if(!el)return;el.select();copyText(el.value);},
  flag:function(){var c=cur();if(c){S.flags[c.it.id]={at:Date.now(),note:''};save();render();}},
  unflag:function(){var c=cur();if(c){delete S.flags[c.it.id];save();render();}},
  aimark:function(){var c=cur();if(c){copyText(markRequest(c.it));UI.notice=['Marking request copied. Paste it into your AI agent.'];render();}},
  backup:function(){if(!download('study-progress-'+(DATA.id||'course')+'.txt',saveCode())){UI.importMsg='Download is blocked here. Copy the code instead.';render();}},
  anki:function(){
    var clean=function(s){return String(s).replace(/[\t\r\n]+/g,' ');};
    var rows=POOL.fc.map(function(c){return [clean(c.front),clean(c.back),clean(M[c.m]?(M[c.m].short||M[c.m].title).replace(/\s+/g,'_'):'')].join('\t');});
    if(!download('flashcards-anki.tsv','#separator:tab\n#tags column:3\n'+rows.join('\n'),'text/tab-separated-values')){UI.importMsg='Download is blocked here.';render();}
  },
  'import':function(){
    var el=document.getElementById('loadcode'),raw=(el&&el.value||'').trim();
    try{var o=JSON.parse(decodeURIComponent(escape(atob(raw))));if(!o||!o.s||typeof o.s.items!=='object')throw 0;
      if(o.id&&DATA.id&&o.id!==DATA.id){UI.importMsg='That code belongs to a different course.';}
      else{S=Object.assign(blank(),o.s);save();UI.importMsg='Restored.';}
    }catch(e){UI.importMsg='That is not a valid saved state code.';}
    render();
  },
  reset1:function(){UI.confirmReset=true;render();},
  reset0:function(){UI.confirmReset=false;render();},
  reset2:function(){S=blank();save();UI.confirmReset=false;UI.unveil={};UI.primer={};render();}
};
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b||b.disabled)return;var fn=ACT[b.dataset.a];if(fn)fn(b.dataset);});
document.addEventListener('input',function(e){
  var el=e.target,c=cur();
  if(el.dataset&&el.dataset.in==='val'&&c)c.t.val=el.value;
  else if(el.dataset&&el.dataset.in==='text'&&c){(S.explain[c.it.id]||(S.explain[c.it.id]={})).text=el.value;save();}
  else if(el.dataset&&el.dataset.in==='flag'&&c&&S.flags[c.it.id]){S.flags[c.it.id].note=el.value;save();}
  else if(el.dataset&&el.dataset.in==='note'){S.notes[UI.m]=el.value;save();}
  else if(el.dataset&&el.dataset.in==='search'){UI.q=el.value;UI.view='search';UI.run=null;UI.notice=[];render({keepSide:true});}
});
document.addEventListener('change',function(e){
  var el=e.target,c=cur();
  if(el.dataset&&el.dataset.tick!=null&&c){c.t.ticks[el.dataset.tick]=el.checked;}
  else if(el.dataset&&el.dataset.ch==='exam'){S.exam=el.value||null;if(!el.value&&C.exam_date)S.exam='none';save();render();}
});
document.addEventListener('keydown',function(e){
  var tg=e.target,tn=tg&&tg.tagName,c=cur();
  if(e.key==='Enter'&&tg&&tg.id==='ans'){if(c&&c.R.exam)ACT.next();else ACT.check();return;}
  if(!c||tn==='INPUT'||tn==='TEXTAREA'||tn==='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(/^[1-6]$/.test(e.key)){var b=document.querySelectorAll('#main .opt')[+e.key-1];if(b&&!b.disabled){b.click();e.preventDefault();}}
  else if(e.key==='ArrowRight')ACT.next();
  else if(e.key==='ArrowLeft')ACT.prev();
  else if(e.key===' '&&c.it._t==='fc'&&tn!=='BUTTON'){ACT.flip();e.preventDefault();}
});
render();
})();
</script>
</body>
</html>
